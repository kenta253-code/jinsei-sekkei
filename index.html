<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生100年設計＆資産計画シミュレーター</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .table-container { max-height: 480px; overflow-y: auto; }
    thead th { position: sticky; top: 0; z-index: 20; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { LineChart, Line, BarChart, Bar, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, PieChart, Pie, Cell } = window.Recharts;

    const CurrencyInput = ({ value, onChange, placeholder = "0", className = "", style = {} }) => {
      const displayValue = useMemo(() => {
        if (value === 0 || value === '0') return '0';
        if (!value && value !== 0) return '';
        const num = String(value).replace(/,/g, '');
        return isNaN(num) ? '' : Number(num).toLocaleString();
      }, [value]);

      const handleChange = (e) => {
        const raw = e.target.value.replace(/,/g, '');
        if (raw === '' || /^-?\d*$/.test(raw)) {
          onChange(raw === '' ? 0 : Number(raw));
        }
      };

      return (
        <input
          type="text"
          value={displayValue}
          onChange={handleChange}
          placeholder={placeholder}
          className={className}
          style={style}
        />
      );
    };

    const App = () => {
      const [theme, setTheme] = useState(() => localStorage.getItem('app_theme') || 'light');
      useEffect(() => {
        localStorage.setItem('app_theme', theme);
      }, [theme]);

      const [activeDrawer, setActiveDrawer] = useState(null);
      const [selectedYearData, setSelectedYearData] = useState(null);
      
      const [accordion, setAccordion] = useState({ 
        profile: true, 
        portfolio: true, 
        corp: false, 
        living: false, 
        pension: false, 
        tax: false, 
        socialInsurance: false, 
        events: false, 
        macro: false 
      });

      const [actAccordion, setActAccordion] = useState({
        stock: true,
        income: true,
        living: true,
        large: false,
        tax: true
      });

      const [isTableExpanded, setIsTableExpanded] = useState(false);
      const [analyticsTab, setAnalyticsTab] = useState('monthly');
      const [monthlySubTab, setMonthlySubTab] = useState('living');

      const [profile, setProfile] = useState({
        startYear: 2027,
        startAge: 56,
        endAge: 100
      });

      const [withdrawalStrategy, setWithdrawalStrategy] = useState('cashFirst');
      const [minCashReserve, setMinCashReserve] = useState(500);

      const [portfolio, setPortfolio] = useState({
        cash: { amount: 2000, rate: 0.0 },
        mutualFund: { amount: 4000, rate: 3.0 },
        stock: { amount: 500, rate: 3.0 }
      });

      const { totalAsset, averageYield } = useMemo(() => {
        const cAmt = Number(portfolio.cash.amount) || 0;
        const fAmt = Number(portfolio.mutualFund.amount) || 0;
        const sAmt = Number(portfolio.stock.amount) || 0;
        const total = cAmt + fAmt + sAmt;
        if (total === 0) return { totalAsset: 0, averageYield: 0 };
        const weightedReturn = (cAmt * (Number(portfolio.cash.rate) || 0)) + 
                               (fAmt * (Number(portfolio.mutualFund.rate) || 0)) + 
                               (sAmt * (Number(portfolio.stock.rate) || 0));
        return { totalAsset: total, averageYield: Number((weightedReturn / total).toFixed(2)) };
      }, [portfolio]);

      const [params, setParams] = useState({ inflationRate: 0.0 });
      
      const [incomePhases, setIncomePhases] = useState([{ id: 1, start: 56, end: 65, amount: 0 }]);
      const [livingPhases, setLivingPhases] = useState([
        { id: 1, start: 56, end: 69, amount: 300 },
        { id: 2, start: 70, end: 100, amount: 250 }
      ]);
      const [pensionPhases, setPensionPhases] = useState([{ id: 1, start: 60, end: 100, amount: 150 }]);
      
      const [taxPhases, setTaxPhases] = useState([
        { id: 1, start: 56, end: 64, amount: 36 },
        { id: 2, start: 65, end: 100, amount: 26 }
      ]);
      const [socialInsurancePhases, setSocialInsurancePhases] = useState([
        { id: 1, start: 56, end: 64, amount: 30 },
        { id: 2, start: 65, end: 100, amount: 20 }
      ]);

      const [events, setEvents] = useState([
        { id: 1, age: 56, title: '旅・法人設立', amount: -300 },
        { id: 2, age: 58, title: 'マンション売却', amount: 4300 },
        { id: 3, age: 58, title: '新居購入', amount: -6500 },
        { id: 4, age: 60, title: 'iDeCo等', amount: 1000 },
        { id: 5, age: 60, title: 'ポルシェ購入', amount: -800 }
      ]);

      const [monthlyActuals, setMonthlyActuals] = useState(() => {
        const saved = localStorage.getItem('monthly_actuals');
        return saved ? JSON.parse(saved) : {};
      });

      useEffect(() => {
        localStorage.setItem('monthly_actuals', JSON.stringify(monthlyActuals));
      }, [monthlyActuals]);

      const [selectedActYear, setSelectedActYear] = useState(2027);
      const [selectedActMonth, setSelectedActMonth] = useState(3);

      const currentActKey = `${selectedActYear}-${String(selectedActMonth).padStart(2, '0')}`;

      const defaultMonthlyData = {
        stockBalances: [
          { id: 'fund', title: '投資信託', amount: 0, isFixed: true, color: 'bg-orange-500' },
          { id: 'cash', title: '預金・現金', amount: 0, isFixed: true, color: 'bg-blue-500' },
          { id: 'stock', title: '株式(現物)', amount: 0, isFixed: true, color: 'bg-red-500' },
          { id: 'bond', title: '債券', amount: 0, isFixed: true, color: 'bg-cyan-500' }
        ],
        income: [
          { id: 'salary', title: '給料・賞与', amount: 0, isFixed: true },
          { id: 'business', title: '事業・役員報酬等', amount: 0, isFixed: true },
          { id: 'other', title: 'その他収入', amount: 0, isFixed: true }
        ],
        livingExpenses: [
          { id: 'housing', title: '住宅', amount: 0, isFixed: true },
          { id: 'food', title: '食費', amount: 0, isFixed: true },
          { id: 'cashCard', title: '現金・カード', amount: 0, isFixed: true },
          { id: 'hobby', title: '趣味・娯楽', amount: 0, isFixed: true },
          { id: 'transport', title: '交通費', amount: 0, isFixed: true },
          { id: 'dailyGoods', title: '日用品', amount: 0, isFixed: true },
          { id: 'utility', title: '水道・光熱費', amount: 0, isFixed: true },
          { id: 'communication', title: '通信費', amount: 0, isFixed: true },
          { id: 'social', title: '交際費', amount: 0, isFixed: true },
          { id: 'beauty', title: '衣服・美容', amount: 0, isFixed: true },
          { id: 'medical', title: '健康・医療', amount: 0, isFixed: true },
          { id: 'education', title: '教養・教育', amount: 0, isFixed: true },
          { id: 'insurance', title: '保険（生命・損害等）', amount: 0, isFixed: true },
          { id: 'otherLiving', title: 'その他', amount: 0, isFixed: true }
        ],
        largeExpenses: [],
        taxInsurance: [
          { id: 'tax', title: '税金', amount: 0, isFixed: true },
          { id: 'social', title: '社会保険等', amount: 0, isFixed: true }
        ]
      };

      const currentMonthData = useMemo(() => {
        const raw = monthlyActuals[currentActKey];
        if (!raw) return defaultMonthlyData;

        const normalizeList = (savedList, defaultList) => {
          if (Array.isArray(savedList)) return savedList;
          if (typeof savedList === 'object' && savedList !== null) {
            return defaultList.map(def => ({
              ...def,
              amount: savedList[def.id] || 0
            }));
          }
          return defaultList;
        };

        return {
          stockBalances: normalizeList(raw.stockBalances, defaultMonthlyData.stockBalances),
          income: normalizeList(raw.income, defaultMonthlyData.income),
          livingExpenses: normalizeList(raw.livingExpenses, defaultMonthlyData.livingExpenses),
          largeExpenses: Array.isArray(raw.largeExpenses) ? raw.largeExpenses : [],
          taxInsurance: normalizeList(raw.taxInsurance, defaultMonthlyData.taxInsurance)
        };
      }, [monthlyActuals, currentActKey]);

      const updateListItem = (category, id, field, value) => {
        const list = currentMonthData[category] || [];
        const updated = list.map(item => item.id === id ? { ...item, [field]: value } : item);
        setMonthlyActuals({
          ...monthlyActuals,
          [currentActKey]: {
            ...currentMonthData,
            [category]: updated
          }
        });
      };

      const addListItem = (category, defaultTitle = '新規項目') => {
        const list = currentMonthData[category] || [];
        const newItem = {
          id: `custom_${Date.now()}`,
          title: defaultTitle,
          amount: 0,
          isFixed: false
        };
        setMonthlyActuals({
          ...monthlyActuals,
          [currentActKey]: {
            ...currentMonthData,
            [category]: [...list, newItem]
          }
        });
      };

      const removeListItem = (category, id) => {
        const list = currentMonthData[category] || [];
        const updated = list.filter(item => item.id !== id);
        setMonthlyActuals({
          ...monthlyActuals,
          [currentActKey]: {
            ...currentMonthData,
            [category]: updated
          }
        });
      };

      const currentStockTotal = useMemo(() => {
        return (currentMonthData.stockBalances || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentMonthData.stockBalances]);

      const currentIncomeTotal = useMemo(() => {
        return (currentMonthData.income || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentMonthData.income]);

      const currentLivingTotal = useMemo(() => {
        return (currentMonthData.livingExpenses || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentMonthData.livingExpenses]);

      const currentLargeTotal = useMemo(() => {
        return (currentMonthData.largeExpenses || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentMonthData.largeExpenses]);

      const currentTaxTotal = useMemo(() => {
        return (currentMonthData.taxInsurance || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentMonthData.taxInsurance]);

      const currentExpenseTotal = currentLivingTotal + currentLargeTotal + currentTaxTotal;
      const currentProfitAndLoss = currentIncomeTotal - currentExpenseTotal;

      const latestStockSummary = useMemo(() => {
        const keys = Object.keys(monthlyActuals).filter(k => {
          const d = monthlyActuals[k];
          if (!d || !d.stockBalances) return false;
          const list = Array.isArray(d.stockBalances) ? d.stockBalances : Object.values(d.stockBalances);
          return list.reduce((sum, item) => sum + (Number(item.amount || item) || 0), 0) > 0;
        }).sort();

        if (keys.length === 0) return null;
        const latestKey = keys[keys.length - 1];
        const latest = monthlyActuals[latestKey];
        const stockList = Array.isArray(latest.stockBalances) ? latest.stockBalances : [];
        
        const getAmt = (id) => {
          const item = stockList.find(x => x.id === id);
          return item ? Number(item.amount) || 0 : (latest.stockBalances?.[id] || 0);
        };

        const cash = getAmt('cash');
        const fund = getAmt('fund');
        const stock = getAmt('stock');
        const bond = getAmt('bond');
        const total = cash + fund + stock + bond;
        const [yearStr, monthStr] = latestKey.split('-');

        return {
          key: latestKey,
          year: parseInt(yearStr),
          month: parseInt(monthStr),
          totalMan: Math.round(total / 10000),
          cashMan: Math.round(cash / 10000),
          fundMan: Math.round(fund / 10000),
          stockMan: Math.round(stock / 10000),
          bondMan: Math.round(bond / 10000),
          raw: { cash, fund, stock, bond, total }
        };
      }, [monthlyActuals]);

      // シミュレーション計算エンジン
      const calculateSimulation = (initialPortfolio, initStrategy, initMinCash, customStartInfo = null) => {
        let currentCash = Number(initialPortfolio.cash.amount) || 0;
        let currentFund = Number(initialPortfolio.mutualFund.amount) || 0;
        let currentStock = Number(initialPortfolio.stock.amount) || 0;
        let currentTotal = currentCash + currentFund + currentStock;
        const data = [];
        
        const startAge = profile.startAge;
        const endAge = profile.endAge;
        const startYear = profile.startYear;

        for (let age = startAge; age <= endAge; age++) {
          const year = startYear + (age - startAge);
          const startAsset = currentTotal;

          let fraction = 1.0;
          let skipPastEvents = false;

          if (customStartInfo && year < customStartInfo.startYear) {
            continue;
          } else if (customStartInfo && year === customStartInfo.startYear) {
            fraction = (12 - customStartInfo.month) / 12;
            skipPastEvents = true;
          }

          let investmentReturn = 0;
          if (initStrategy === 'weighted') {
            const grossReturn = currentTotal > 0 ? currentTotal * (averageYield / 100) : 0;
            investmentReturn = grossReturn * 0.8 * fraction;
          } else {
            const fundReturn = currentFund > 0 ? currentFund * ((Number(initialPortfolio.mutualFund.rate) || 0) / 100) * 0.8 : 0;
            const stockReturn = currentStock > 0 ? currentStock * ((Number(initialPortfolio.stock.rate) || 0) / 100) * 0.8 : 0;
            investmentReturn = (fundReturn + stockReturn) * fraction;
          }

          const incomePhase = incomePhases.find(p => age >= p.start && age <= p.end);
          const income = (incomePhase ? incomePhase.amount : 0) * fraction;
          const pensionPhase = pensionPhases.find(p => age >= p.start && age <= p.end);
          const pension = (pensionPhase ? pensionPhase.amount : 0) * fraction;

          const yearEvents = events.filter(e => e.age === age);
          let specialIncome = yearEvents.filter(e => e.amount > 0).reduce((sum, e) => sum + e.amount, 0);
          let specialExpense = Math.abs(yearEvents.filter(e => e.amount < 0).reduce((sum, e) => sum + e.amount, 0));

          if (skipPastEvents && fraction < 1.0) {
            specialIncome = specialIncome * fraction;
            specialExpense = specialExpense * fraction;
          }

          const totalIncome = investmentReturn + pension + income + specialIncome;

          const livingPhase = livingPhases.find(p => age >= p.start && age <= p.end);
          const baseLiving = (livingPhase ? livingPhase.amount : 0) * fraction;
          const inflatedLiving = baseLiving * Math.pow(1 + params.inflationRate / 100, age - startAge);
          
          const taxPhase = taxPhases.find(p => age >= p.start && age <= p.end);
          const tax = (taxPhase ? taxPhase.amount : 0) * fraction;
          const socialPhase = socialInsurancePhases.find(p => age >= p.start && age <= p.end);
          const socialInsurance = (socialPhase ? socialPhase.amount : 0) * fraction;

          const totalExpense = inflatedLiving + tax + socialInsurance + specialExpense;
          const profitAndLoss = totalIncome - totalExpense;
          currentTotal = currentTotal + profitAndLoss;

          if (initStrategy === 'cashFirst') {
            currentCash += (investmentReturn + pension + income + specialIncome);
            currentCash -= totalExpense;

            if (currentCash < initMinCash) {
              const shortfall = initMinCash - currentCash;
              if (currentFund >= shortfall) {
                currentFund -= shortfall;
                currentCash = initMinCash;
              } else {
                const remainShortfall = shortfall - currentFund;
                currentFund = 0;
                if (currentStock >= remainShortfall) {
                  currentStock -= remainShortfall;
                  currentCash = initMinCash;
                } else {
                  currentCash = initMinCash - (remainShortfall - currentStock);
                  currentStock = 0;
                }
              }
            }
          } else {
            const ratio = currentTotal > 0 && totalAsset > 0 ? currentTotal / totalAsset : 0;
            currentCash = (Number(initialPortfolio.cash.amount) || 0) * ratio;
            currentFund = (Number(initialPortfolio.mutualFund.amount) || 0) * ratio;
            currentStock = (Number(initialPortfolio.stock.amount) || 0) * ratio;
          }

          const eventTitles = yearEvents.map(e => e.title).join(' / ');
          const endAssetRounded = Math.round(currentTotal);
          const c = Math.max(0, Math.round(currentCash));
          const f = Math.max(0, Math.round(currentFund));
          const s = Math.max(0, Math.round(currentStock));
          const validSum = c + f + s;
          const cashRatio = validSum > 0 ? Number(((c / validSum) * 100).toFixed(1)) : 0;
          const fundRatio = validSum > 0 ? Number(((f / validSum) * 100).toFixed(1)) : 0;
          const stockRatio = validSum > 0 ? Number(((s / validSum) * 100).toFixed(1)) : 0;

          const prevAsset = Math.round(startAsset);
          const diffFromPrev = endAssetRounded - prevAsset;
          const diffRatioFromPrev = prevAsset !== 0 ? Number(((diffFromPrev / prevAsset) * 100).toFixed(1)) : 0;

          data.push({
            age,
            year,
            startAsset: prevAsset,
            income: Math.round(income),
            specialIncome: Math.round(specialIncome),
            investmentReturn: Math.round(investmentReturn),
            pension: Math.round(pension),
            totalIncome: Math.round(totalIncome),
            livingExpense: Math.round(inflatedLiving),
            specialExpense: Math.round(specialExpense),
            tax: Math.round(tax),
            socialInsurance: Math.round(socialInsurance),
            totalExpense: Math.round(totalExpense),
            profitAndLoss: Math.round(profitAndLoss),
            endAsset: endAssetRounded,
            prevAsset,
            diffFromPrev,
            diffRatioFromPrev,
            breakdown: { cash: c, fund: f, stock: s, cashRatio, fundRatio, stockRatio },
            eventTitles
          });
        }
        return data;
      };

      const simulationData = useMemo(() => {
        return calculateSimulation(portfolio, withdrawalStrategy, minCashReserve);
      }, [profile, params, incomePhases, livingPhases, pensionPhases, taxPhases, socialInsurancePhases, events, totalAsset, averageYield, withdrawalStrategy, minCashReserve, portfolio]);

      const planFinalAsset = simulationData[simulationData.length - 1]?.endAsset || 0;

      const currentYearPlanDiff = useMemo(() => {
        if (!latestStockSummary) return null;
        const targetYear = latestStockSummary.year;
        const planRow = simulationData.find(d => d.year === targetYear);
        if (!planRow) {
          const startRow = simulationData[0];
          const diff = latestStockSummary.totalMan - startRow.startAsset;
          return { targetYear, planAsset: startRow.startAsset, diff };
        }
        const diff = latestStockSummary.totalMan - planRow.startAsset;
        return { targetYear, planAsset: planRow.startAsset, diff };
      }, [latestStockSummary, simulationData]);

      const actualRollingForecast = useMemo(() => {
        if (!latestStockSummary) return null;
        
        const actualPortfolio = {
          cash: { amount: latestStockSummary.cashMan + latestStockSummary.bondMan, rate: portfolio.cash.rate },
          mutualFund: { amount: latestStockSummary.fundMan, rate: portfolio.mutualFund.rate },
          stock: { amount: latestStockSummary.stockMan, rate: portfolio.stock.rate }
        };

        const customStartInfo = {
          startYear: latestStockSummary.year,
          month: latestStockSummary.month
        };

        const reSimData = calculateSimulation(actualPortfolio, withdrawalStrategy, minCashReserve, customStartInfo);
        const actualFinalAsset = reSimData[reSimData.length - 1]?.endAsset || 0;
        const diffFromPlan = actualFinalAsset - planFinalAsset;

        const firstDepleted = reSimData.find(d => d.endAsset < 0);
        const isDepleted = !!firstDepleted;
        const depletedYear = firstDepleted ? firstDepleted.year : null;
        const depletedAge = firstDepleted ? firstDepleted.age : null;

        return {
          actualFinalAsset,
          diffFromPlan,
          isDepleted,
          depletedYear,
          depletedAge,
          forecastData: reSimData
        };
      }, [latestStockSummary, portfolio, withdrawalStrategy, minCashReserve, planFinalAsset, profile, params, incomePhases, livingPhases, pensionPhases, taxPhases, socialInsurancePhases, events, totalAsset, averageYield]);

      // 年次決算レビュー用データ生成（選択行の年の月次実績を集計）
      const selectedYearReview = useMemo(() => {
        if (!selectedYearData) return null;
        const targetYear = selectedYearData.year;
        const yearKeys = Object.keys(monthlyActuals).filter(k => k.startsWith(`${targetYear}-`)).sort();
        
        if (yearKeys.length === 0) return null; // 実績なし

        let totalIncome = 0;
        let totalLiving = 0;
        let totalLarge = 0;
        let totalTax = 0;
        let totalSocial = 0;

        yearKeys.forEach(k => {
          const d = monthlyActuals[k];
          totalIncome += (d.income || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
          totalLiving += (d.livingExpenses || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
          totalLarge += (d.largeExpenses || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
          
          const taxes = d.taxInsurance || [];
          const taxItem = taxes.find(x => x.id === 'tax' || x.title?.includes('税'));
          const socialItem = taxes.find(x => x.id === 'social' || x.title?.includes('保険'));
          totalTax += (taxItem ? Number(taxItem.amount) || 0 : 0);
          totalSocial += (socialItem ? Number(socialItem.amount) || 0 : 0);
        });

        // 最新月の資産残高（期末実績）
        const lastKey = yearKeys[yearKeys.length - 1];
        const lastData = monthlyActuals[lastKey];
        const stockList = lastData?.stockBalances || [];
        const getAmt = (id) => {
          const item = stockList.find(x => x.id === id);
          return item ? Number(item.amount) || 0 : (lastData?.stockBalances?.[id] || 0);
        };

        const endCash = Math.round(getAmt('cash') / 10000);
        const endFund = Math.round(getAmt('fund') / 10000);
        const endStock = Math.round(getAmt('stock') / 10000);
        const endBond = Math.round(getAmt('bond') / 10000);
        const endTotal = endCash + endFund + endStock + endBond;

        const incomeMan = Math.round(totalIncome / 10000);
        const livingMan = Math.round(totalLiving / 10000);
        const largeMan = Math.round(totalLarge / 10000);
        const taxMan = Math.round(totalTax / 10000);
        const socialMan = Math.round(totalSocial / 10000);
        const expenseMan = livingMan + largeMan + taxMan + socialMan;
        const plMan = incomeMan - expenseMan;

        // 予実差 (実績 - 計画)
        const diffPL = plMan - selectedYearData.profitAndLoss;
        const diffEndAsset = endTotal - selectedYearData.endAsset;
        const diffLiving = livingMan - selectedYearData.livingExpense; // マイナスなら節約成功

        // スコア算出 (100点満点基準)
        let score = 85;
        if (diffPL >= 0) score += 10;
        else score -= Math.min(25, Math.abs(Math.round(diffPL / 10)));
        if (diffLiving <= 0) score += 5;
        score = Math.max(50, Math.min(100, score));

        let grade = 'A';
        if (score >= 95) grade = 'S';
        else if (score >= 85) grade = 'A';
        else if (score >= 70) grade = 'B';
        else grade = 'C';

        return {
          monthCount: yearKeys.length,
          lastMonthStr: lastKey.split('-')[1],
          isFullYear: yearKeys.length === 12,
          actual: {
            income: incomeMan,
            living: livingMan,
            large: largeMan,
            tax: taxMan,
            social: socialMan,
            expense: expenseMan,
            pl: plMan,
            endAsset: endTotal,
            breakdown: { cash: endCash, fund: endFund, stock: endStock, bond: endBond }
          },
          diff: {
            pl: diffPL,
            endAsset: diffEndAsset,
            living: diffLiving

        const keys = Object.keys(monthlyActuals).sort();
        if (keys.length === 0) return { cfHistory: [], stockHistory: [], livingComparison: [], aiInsight: null, prevYearNum: null, prevMonthKey: null };

        const cfHistory = keys.map(k => {
          const item = monthlyActuals[k];
          const inc = (item.income || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
          const liv = (item.livingExpenses || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
          const lrg = (item.largeExpenses || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
          const tax = (item.taxInsurance || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
          const exp = liv + lrg + tax;
          return {
            monthKey: k,
            incomeMan: Math.round(inc / 10000),
            expenseMan: Math.round(exp / 10000),
            plMan: Math.round((inc - exp) / 10000)
          };
        });

        const stockHistory = keys.map(k => {
          const item = monthlyActuals[k];
          const list = item.stockBalances || [];
          const getVal = (id) => Math.round(((list.find(x => x.id === id)?.amount) || 0) / 10000);
          const c = getVal('cash');
          const f = getVal('fund');
          const s = getVal('stock');
          const b = getVal('bond');
          return {
            monthKey: k,
            cash: c,
            fund: f,
            stock: s,
            bond: b,
            total: c + f + s + b
          };
        });

        const latestKey = keys[keys.length - 1];
        const [latestYStr, latestMStr] = latestKey.split('-');
        const latestYearNum = parseInt(latestYStr);
        const latestMonthNum = parseInt(latestMStr);

        const prevMonthDate = new Date(latestYearNum, latestMonthNum - 2, 1);
        const prevMonthKey = `${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth() + 1).padStart(2, '0')}`;
        const prevItem = monthlyActuals[prevMonthKey] || null;

        const prevYearNum = latestYearNum - 1;
        const prevYearKeys = keys.filter(k => k.startsWith(`${prevYearNum}-`));
        const prevYearMonthsCount = prevYearKeys.length;

        const prevYearLivingSum = {};
        if (prevYearMonthsCount > 0) {
          prevYearKeys.forEach(k => {
            (monthlyActuals[k]?.livingExpenses || []).forEach(x => {
              prevYearLivingSum[x.title] = (prevYearLivingSum[x.title] || 0) + (Number(x.amount) || 0);
            });
          });
        }

        const latestItem = monthlyActuals[latestKey];
        const latestLivingMap = {};
        (latestItem.livingExpenses || []).forEach(x => {
          latestLivingMap[x.title] = Number(x.amount) || 0;
        });

        const prevLivingMap = {};
        if (prevItem) {
          (prevItem.livingExpenses || []).forEach(x => {
            prevLivingMap[x.title] = Number(x.amount) || 0;
          });
        }

        const livingComparison = Object.keys(latestLivingMap).map(title => {
          const currentAmt = latestLivingMap[title];
          const hasPrev = !!prevItem && prevLivingMap[title] !== undefined;
          const prevAmt = hasPrev ? prevLivingMap[title] : 0;
          const diffPrevAmt = hasPrev ? currentAmt - prevAmt : 0;

          const hasPrevYear = prevYearMonthsCount > 0 && prevYearLivingSum[title] !== undefined;
          const prevYearAvgAmt = hasPrevYear ? Math.round(prevYearLivingSum[title] / prevYearMonthsCount) : 0;
          const diffPrevYearAmt = hasPrevYear ? currentAmt - prevYearAvgAmt : 0;

          return {
            title,
            currentAmt,
            currentMan: Math.round(currentAmt / 10000),
            hasPrev,
            diffPrevAmt,
            hasPrevYear,
            prevYearAvgAmt,
            diffPrevYearAmt
          };
        }).filter(item => item.currentAmt > 0 || item.hasPrev || item.hasPrevYear)
          .sort((a, b) => b.currentAmt - a.currentAmt);

        const latestCF = cfHistory[cfHistory.length - 1];
        const savingsRate = latestCF.incomeMan > 0 ? Math.round((latestCF.plMan / latestCF.incomeMan) * 100) : 0;
        const topDiffPrevItem = [...livingComparison].filter(x => x.hasPrev).sort((a, b) => b.diffPrevAmt - a.diffPrevAmt)[0];

        return {
          cfHistory,
          stockHistory,
          livingComparison,
          prevMonthKey,
          prevYearNum,
          prevYearMonthsCount,
          aiInsight: {
            latestKey,
            prevMonthKey,
            savingsRate,
            plMan: latestCF.plMan,
            incomeMan: latestCF.incomeMan,
            expenseMan: latestCF.expenseMan,
            topDiffPrevItem

                              </div>
                              <div className="flex justify-between items-center p-1.5 rounded bg-slate-50 dark:bg-zinc-800/40">
                                <span className="flex items-center"><span className="w-2 h-2 rounded-full bg-red-500 mr-1.5"></span>株式</span>
                                <span className="font-bold">{selectedYearReview.actual.breakdown.stock}万 (計画:{selectedYearData.breakdown.stock}万)</span>
                              </div>
                            </div>
                          </div>
                        ) : (
                          <div className="space-y-2 text-xs">
                            <div className={`p-2.5 rounded-lg border ${currentStyle.subItemBg}`}>
                              <span className="text-[10px] font-bold opacity-70 block">期末計画資産</span>
                              <span className="text-base font-black">{selectedYearData.endAsset.toLocaleString()} 万円</span>
                            </div>
                            <div className="space-y-1 text-[11px] opacity-80">
                              <div className="flex justify-between"><span>預金・現金</span><span className="font-bold">{selectedYearData.breakdown.cash}万</span></div>
                              <div className="flex justify-between"><span>投資信託</span><span className="font-bold">{selectedYearData.breakdown.fund}万</span></div>
                              <div className="flex justify-between"><span>個別株式</span><span className="font-bold">{selectedYearData.breakdown.stock}万</span></div>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>

                    {/* ③ C/F (キャッシュフロー計算書) */}
                    <div className={`p-4 rounded-xl border flex flex-col justify-between ${currentStyle.subCardBg}`}>
                      <div>
                        <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-200/60">
                          <h3 className="text-xs font-bold flex items-center">
                            <span className="mr-1.5">💸</span> C/F (資金移動対比)
                          </h3>
                          <span className="text-[10px] opacity-60">単位: 万円</span>
                        </div>

                        {selectedYearReview ? (
                          <div className="space-y-2 text-xs">
                            <div className={`p-2 rounded border ${currentStyle.subItemBg}`}>
                              <span className="font-bold block text-[10px]">基礎生活 C/F (収入 - 支出)</span>
                              <div className="flex justify-between items-baseline mt-0.5">
                                <span className="opacity-70 text-[10px]">実績 / 計画</span>
                                <span className="font-bold">
                                  {selectedYearReview.actual.income - selectedYearReview.actual.living - selectedYearReview.actual.tax - selectedYearReview.actual.social}万 / {selectedYearData.income + selectedYearData.pension - selectedYearData.livingExpense - selectedYearData.tax - selectedYearData.socialInsurance}万
                                </span>
                              </div>
                            </div>

                            <div className={`p-2 rounded border ${currentStyle.subItemBg}`}>
                              <span className="font-bold block text-[10px]">大型・特別支出 C/F</span>
                              <div className="flex justify-between items-baseline mt-0.5">
                                <span className="opacity-70 text-[10px]">実績 / 計画</span>
                                <span className="font-bold">
                                  -{selectedYearReview.actual.large}万 / -{selectedYearData.specialExpense}万
                                </span>
                              </div>
                            </div>

                            <div className="p-2 rounded bg-teal-50 dark:bg-zinc-800 border border-teal-200 text-[10px] leading-relaxed">
                              <span className="font-bold text-teal-800 dark:text-teal-300">防衛資金チェック:</span><br/>
                              最低現金枠（{minCashReserve}万円）を維持しながら適切に資金循環が行われています。
                            </div>
                          </div>
                        ) : (
                          <div className="space-y-2 text-xs">
                            <div className={`p-2 rounded border ${currentStyle.subItemBg}`}>
                              <span className="font-bold block text-[10px]">基礎生活 C/F (計画)</span>
                              <span className="text-right block font-bold mt-0.5">
                                {(selectedYearData.income + selectedYearData.pension - selectedYearData.livingExpense - selectedYearData.tax - selectedYearData.socialInsurance).toLocaleString()} 万円
                              </span>
                            </div>
                            <div className={`p-2 rounded border ${currentStyle.subItemBg}`}>
                              <span className="font-bold block text-[10px]">投資インカム C/F (計画)</span>
                              <span className="text-right block font-bold text-teal-600 mt-0.5">
                                +{selectedYearData.investmentReturn.toLocaleString()} 万円
                              </span>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>

                  </div>
                </div>
              </div>
            </div>
          )}

          {(activeDrawer || selectedYearData) && (
            <div 
              className="fixed inset-0 bg-slate-900/50 z-40 transition-opacity"
              onClick={() => { setActiveDrawer(null); setSelectedYearData(null); }}
            ></div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
