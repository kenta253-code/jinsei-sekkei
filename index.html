<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生100年設計＆資産計画シミュレーター</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .table-container { max-height: calc(100vh - 270px); overflow-y: auto; }
    thead th { position: sticky; top: 0; z-index: 20; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, PieChart, Pie, Cell } = window.Recharts;

    const App = () => {
      // --- テーマ管理 (localStorage 保存) ---
      const [theme, setTheme] = useState(() => localStorage.getItem('app_theme') || 'light');

      useEffect(() => {
        localStorage.setItem('app_theme', theme);
      }, [theme]);

      // --- ドロワー・モーダル管理 ---
      const [activeDrawer, setActiveDrawer] = useState(null); // 'settings' | 'analytics' | 'appConfig' | 'monthlyActual' | null
      const [selectedYearData, setSelectedYearData] = useState(null);
      const [accordion, setAccordion] = useState({ profile: true, portfolio: true, corp: false, living: false, pension: false, tax: false, events: false, macro: false });

      // --- 基本プロファイル ---
      const [profile, setProfile] = useState({
        startYear: 2027,
        startAge: 56,
        endAge: 100
      });

      // 計算方式: 'weighted' | 'cashFirst'
      const [withdrawalStrategy, setWithdrawalStrategy] = useState('cashFirst');
      const [minCashReserve, setMinCashReserve] = useState(500);

      // 初期資産ポートフォリオ（計画用）
      const [portfolio, setPortfolio] = useState({
        cash: { amount: 3000, rate: 0.0 },       // 現金・預金(金利%)
        mutualFund: { amount: 4000, rate: 3.0 }, // 投資信託(利回り%)
        stock: { amount: 500, rate: 3.0 }        // 個別株式(利回り%)
      });

      const { totalAsset, averageYield } = useMemo(() => {
        const total = portfolio.cash.amount + portfolio.mutualFund.amount + portfolio.stock.amount;
        if (total === 0) return { totalAsset: 0, averageYield: 0 };
        const weightedReturn = (portfolio.cash.amount * portfolio.cash.rate) + (portfolio.mutualFund.amount * portfolio.mutualFund.rate) + (portfolio.stock.amount * portfolio.stock.rate);
        return { totalAsset: total, averageYield: Number((weightedReturn / total).toFixed(2)) };
      }, [portfolio]);

      const [params, setParams] = useState({ inflationRate: 0.0 });
      
      const [incomePhases, setIncomePhases] = useState([
        { id: 1, start: 56, end: 65, amount: 0 }
      ]);
      
      const [livingPhases, setLivingPhases] = useState([
        { id: 1, start: 56, end: 69, amount: 300 },
        { id: 2, start: 70, end: 100, amount: 250 }
      ]);
      const [pensionPhases, setPensionPhases] = useState([{ id: 1, start: 60, end: 100, amount: 150 }]);
      const [taxPhases, setTaxPhases] = useState([
        { id: 1, start: 56, end: 64, amount: 66 },
        { id: 2, start: 65, end: 100, amount: 46 }
      ]);
      const [events, setEvents] = useState([
        { id: 1, age: 56, title: '旅・法人設立', amount: -300 },
        { id: 2, age: 58, title: 'マンション売却', amount: 4300 },
        { id: 3, age: 58, title: '新居購入', amount: -6500 },
        { id: 4, age: 60, title: 'iDeCo等', amount: 1000 },
        { id: 5, age: 60, title: 'ポルシェ購入', amount: -800 }
      ]);

      // --- 月次実績データ (localStorage 保存) ---
      const [monthlyActuals, setMonthlyActuals] = useState(() => {
        const saved = localStorage.getItem('monthly_actuals');
        return saved ? JSON.parse(saved) : {};
      });

      useEffect(() => {
        localStorage.setItem('monthly_actuals', JSON.stringify(monthlyActuals));
      }, [monthlyActuals]);

      // 月次入力フォームの選択年・月
      const [selectedActYear, setSelectedActYear] = useState(2026);
      const [selectedActMonth, setSelectedActMonth] = useState(8);

      const currentActKey = `${selectedActYear}-${String(selectedActMonth).padStart(2, '0')}`;
      
      // デフォルトの月次空データ構造
      const defaultMonthlyData = {
        // ストック (MF資産画面より1円単位)
        stockBalances: {
          fund: 0,   // 投資信託
          cash: 0,   // 預金・現金
          stock: 0,  // 株式(現物)
          bond: 0    // 債券
        },
        // フロー収入
        income: {
          salary: 0,
          business: 0,
          other: 0
        },
        // フロー生活費 (MF大項目順)
        livingExpenses: {
          housing: 0,       // 住宅
          food: 0,          // 食費
          cashCard: 0,      // 現金・カード
          hobby: 0,         // 趣味・娯楽
          transport: 0,     // 交通費
          dailyGoods: 0,    // 日用品
          utility: 0,       // 水道・光熱費
          communication: 0, // 通信費
          social: 0,        // 交際費
          beauty: 0,        // 衣服・美容
          medical: 0,       // 健康・医療
          education: 0,     // 教養・教育
          mfSpecial: 0      // 特別な支出 (100万円以下)
        },
        // 大型特別支出 (100万円超)
        largeExpenses: [],
        // 税・保険
        taxInsurance: {
          taxSocial: 0,     // 税・社会保険
          insurance: 0      // 保険
        }
      };

      const currentMonthData = monthlyActuals[currentActKey] || defaultMonthlyData;

      // 月次データ更新ハンドラ
      const updateMonthlyData = (category, field, value) => {
        const prev = monthlyActuals[currentActKey] || JSON.parse(JSON.stringify(defaultMonthlyData));
        const updated = {
          ...prev,
          [category]: {
            ...prev[category],
            [field]: parseFloat(value) || 0
          }
        };
        setMonthlyActuals({
          ...monthlyActuals,
          [currentActKey]: updated
        });
      };

      // 大型特別支出の追加・削除
      const addLargeExpense = () => {
        const prev = monthlyActuals[currentActKey] || JSON.parse(JSON.stringify(defaultMonthlyData));
        const list = prev.largeExpenses || [];
        const updated = {
          ...prev,
          largeExpenses: [...list, { id: Date.now(), title: '大型支出', amount: 1000000 }]
        };
        setMonthlyActuals({ ...monthlyActuals, [currentActKey]: updated });
      };

      const removeLargeExpense = (id) => {
        const prev = monthlyActuals[currentActKey] || JSON.parse(JSON.stringify(defaultMonthlyData));
        const updated = {
          ...prev,
          largeExpenses: (prev.largeExpenses || []).filter(e => e.id !== id)
        };
        setMonthlyActuals({ ...monthlyActuals, [currentActKey]: updated });
      };

      const updateLargeExpense = (id, field, value) => {
        const prev = monthlyActuals[currentActKey] || JSON.parse(JSON.stringify(defaultMonthlyData));
        const updated = {
          ...prev,
          largeExpenses: (prev.largeExpenses || []).map(e => e.id === id ? { ...e, [field]: field === 'title' ? value : parseFloat(value) || 0 } : e)
        };
        setMonthlyActuals({ ...monthlyActuals, [currentActKey]: updated });
      };

      // 最新の入力済み月次ストック（カード③用）を抽出
      const latestStockSummary = useMemo(() => {
        const keys = Object.keys(monthlyActuals).filter(k => {
          const d = monthlyActuals[k];
          if (!d || !d.stockBalances) return false;
          const s = d.stockBalances;
          return (s.cash + s.fund + s.stock + s.bond) > 0;
        }).sort();

        if (keys.length === 0) return null;
        const latestKey = keys[keys.length - 1];
        const latest = monthlyActuals[latestKey].stockBalances;
        const totalYen = (latest.cash || 0) + (latest.fund || 0) + (latest.stock || 0) + (latest.bond || 0);
        return {
          key: latestKey,
          totalMan: Math.round(totalYen / 10000),
          cashMan: Math.round((latest.cash || 0) / 10000),
          fundMan: Math.round((latest.fund || 0) / 10000),
          stockMan: Math.round((latest.stock || 0) / 10000),
          bondMan: Math.round((latest.bond || 0) / 10000),
          raw: latest
        };
      }, [monthlyActuals]);

      // --- シミュレーション計算 ---
      const simulationData = useMemo(() => {
        let currentTotal = totalAsset;
        let currentCash = portfolio.cash.amount;
        let currentFund = portfolio.mutualFund.amount;
        let currentStock = portfolio.stock.amount;
        const data = [];
        
        const startAge = profile.startAge;
        const endAge = profile.endAge;
        const startYear = profile.startYear;

        for (let age = startAge; age <= endAge; age++) {
          const year = startYear + (age - startAge);
          const startAsset = currentTotal;

          let investmentReturn = 0;

          if (withdrawalStrategy === 'weighted') {
            const grossReturn = currentTotal > 0 ? currentTotal * (averageYield / 100) : 0;
            investmentReturn = grossReturn * 0.8;
          } else {
            const fundReturn = currentFund > 0 ? currentFund * (portfolio.mutualFund.rate / 100) * 0.8 : 0;
            const stockReturn = currentStock > 0 ? currentStock * (portfolio.stock.rate / 100) * 0.8 : 0;
            investmentReturn = fundReturn + stockReturn;
          }

          const incomePhase = incomePhases.find(p => age >= p.start && age <= p.end);
          const income = incomePhase ? incomePhase.amount : 0;
          const pensionPhase = pensionPhases.find(p => age >= p.start && age <= p.end);
          const pension = pensionPhase ? pensionPhase.amount : 0;

          const yearEvents = events.filter(e => e.age === age);
          const specialIncome = yearEvents.filter(e => e.amount > 0).reduce((sum, e) => sum + e.amount, 0);
          const totalIncome = investmentReturn + pension + income + specialIncome;

          const livingPhase = livingPhases.find(p => age >= p.start && age <= p.end);
          const baseLiving = livingPhase ? livingPhase.amount : 0;
          const inflatedLiving = baseLiving * Math.pow(1 + params.inflationRate / 100, age - startAge);
          const taxPhase = taxPhases.find(p => age >= p.start && age <= p.end);
          const tax = taxPhase ? taxPhase.amount : 0;
          const specialExpense = Math.abs(yearEvents.filter(e => e.amount < 0).reduce((sum, e) => sum + e.amount, 0));
          const totalExpense = inflatedLiving + tax + specialExpense;

          const profitAndLoss = totalIncome - totalExpense;
          currentTotal = currentTotal + profitAndLoss;

          if (withdrawalStrategy === 'cashFirst') {
            currentCash += (investmentReturn + pension + income + specialIncome);
            currentCash -= totalExpense;

            if (currentCash < minCashReserve) {
              const shortfall = minCashReserve - currentCash;
              if (currentFund >= shortfall) {
                currentFund -= shortfall;
                currentCash = minCashReserve;
              } else {
                const remainShortfall = shortfall - currentFund;
                currentFund = 0;
                if (currentStock >= remainShortfall) {
                  currentStock -= remainShortfall;
                  currentCash = minCashReserve;
                } else {
                  currentCash = minCashReserve - (remainShortfall - currentStock);
                  currentStock = 0;
                }
              }
            }
          } else {
            const ratio = currentTotal > 0 && totalAsset > 0 ? currentTotal / totalAsset : 0;
            currentCash = portfolio.cash.amount * ratio;
            currentFund = portfolio.mutualFund.amount * ratio;
            currentStock = portfolio.stock.amount * ratio;
          }

          const eventTitles = yearEvents.map(e => e.title).join(' / ');

          const endAssetRounded = Math.round(currentTotal);
          const c = Math.max(0, Math.round(currentCash));
          const f = Math.max(0, Math.round(currentFund));
          const s = Math.max(0, Math.round(currentStock));
          const validSum = c + f + s;
          const cashRatio = validSum > 0 ? Number(((c / validSum) * 100).toFixed(1)) : 0;
          const fundRatio = validSum > 0 ? Number(((f / validSum) * 100).toFixed(1)) : 0;
          const stockRatio = validSum > 0 ? Number(((s / validSum) * 100).toFixed(1)) : 0;

          const prevAsset = Math.round(startAsset);
          const diffFromPrev = endAssetRounded - prevAsset;
          const diffRatioFromPrev = prevAsset !== 0 ? Number(((diffFromPrev / prevAsset) * 100).toFixed(1)) : 0;

          data.push({
            age,
            year,
            startAsset: prevAsset,
            income,
            specialIncome,
            investmentReturn: Math.round(investmentReturn),
            pension,
            totalIncome: Math.round(totalIncome),
            livingExpense: Math.round(inflatedLiving),
            specialExpense,
            tax,
            totalExpense: Math.round(totalExpense),
            profitAndLoss: Math.round(profitAndLoss),
            endAsset: endAssetRounded,
            prevAsset,
            diffFromPrev,
            diffRatioFromPrev,
            breakdown: { cash: c, fund: f, stock: s, cashRatio, fundRatio, stockRatio },
            eventTitles
          });
        }
        return data;
      }, [profile, params, incomePhases, livingPhases, pensionPhases, taxPhases, events, totalAsset, averageYield, withdrawalStrategy, minCashReserve, portfolio]);

      const planFinalAsset = simulationData[simulationData.length - 1]?.endAsset || 0;

      // 資金枯渇チェック
      const depletionInfo = useMemo(() => {
        const firstDepleted = simulationData.find(d => d.endAsset < 0);
        if (firstDepleted) {
          return {
            isDepleted: true,
            year: firstDepleted.year,
            age: firstDepleted.age
          };
        }
        return { isDepleted: false, year: null, age: null };
      }, [simulationData]);

      const handlePortfolioChange = (category, field, value) => {
        setPortfolio({ ...portfolio, [category]: { ...portfolio[category], [field]: parseFloat(value) || 0 } });
      };

      const createPhaseHandlers = (state, setState) => ({
        add: () => setState([...state, { id: Date.now(), start: profile.startAge, end: profile.endAge, amount: 0 }]),
        remove: (id) => setState(state.filter(p => p.id !== id)),
        update: (id, field, value) => setState(state.map(p => p.id === id ? { ...p, [field]: parseFloat(value) || 0 } : p))
      });

      const incomeHandlers = createPhaseHandlers(incomePhases, setIncomePhases);
      const livingHandlers = createPhaseHandlers(livingPhases, setLivingPhases);
      const pensionHandlers = createPhaseHandlers(pensionPhases, setPensionPhases);
      const taxHandlers = createPhaseHandlers(taxPhases, setTaxPhases);

      const addEvent = () => {
        const nextEvents = [...events, { id: Date.now(), age: profile.startAge, title: '新規イベント', amount: 0 }];
        nextEvents.sort((a, b) => a.age - b.age);
        setEvents(nextEvents);
      };
      const removeEvent = (id) => setEvents(events.filter(e => e.id !== id));
      const updateEvent = (id, field, value) => {
        const nextEvents = events.map(e => e.id === id ? { ...e, [field]: field === 'title' ? value : parseFloat(value) || 0 } : e);
        if (field === 'age') nextEvents.sort((a, b) => a.age - b.age);
        setEvents(nextEvents);
      };

      // --- テーマ別スタイルマッピング ---
      const themeStyles = {
        light: {
          bg: 'bg-slate-100',
          text: 'text-slate-800',
          cardBg: 'bg-white',
          border: 'border-slate-200',
          headerBg: 'bg-slate-900',
          headerText: 'text-white',
          accentBtn: 'bg-teal-600 hover:bg-teal-500 text-white',
          actBtn: 'bg-blue-600 hover:bg-blue-500 text-white',
          subBtn: 'bg-slate-800 hover:bg-slate-700 text-teal-300 border border-teal-500/30',
          thBase: 'bg-slate-200 text-slate-800 border-b border-slate-300',
          thIncome: 'bg-teal-100 text-teal-950 border-b border-slate-300',
          thExpense: 'bg-rose-100 text-rose-950 border-b border-slate-300',
          thTotal: 'bg-slate-300 text-slate-900 border-b border-slate-400 font-black',
          tableRowHover: 'hover:bg-teal-50/50',
          tableBorder: 'border-slate-100',
          chartLine: '#0d9488',
          inputBg: 'bg-white text-slate-800 border-slate-300',
          panelHeader: 'bg-slate-900 text-white',
          modalCardBg: 'bg-white text-slate-800 border-slate-200',
          modalColBg: 'bg-slate-50 border-slate-200',
          modalItemBg: 'bg-white border-slate-200',
          modalTextMain: 'text-slate-800',
          modalTextSub: 'text-slate-500'
        },
        dark: {
          bg: 'bg-zinc-950',
          text: 'text-zinc-100',
          cardBg: 'bg-zinc-900',
          border: 'border-zinc-800',
          headerBg: 'bg-black border-b border-zinc-800',
          headerText: 'text-white',
          accentBtn: 'bg-cyan-600 hover:bg-cyan-500 text-white',
          actBtn: 'bg-indigo-600 hover:bg-indigo-500 text-white',
          subBtn: 'bg-zinc-800 hover:bg-zinc-700 text-cyan-400 border border-cyan-500/30',
          thBase: 'bg-zinc-800 text-zinc-100 border-b border-zinc-700',
          thIncome: 'bg-cyan-950 text-cyan-200 border-b border-zinc-700',
          thExpense: 'bg-rose-950 text-rose-200 border-b border-zinc-700',
          thTotal: 'bg-zinc-700 text-white border-b border-zinc-600 font-black',
          tableRowHover: 'hover:bg-zinc-800/60',
          tableBorder: 'border-zinc-800',
          chartLine: '#06b6d4',
          inputBg: 'bg-zinc-800 text-white border-zinc-700',
          panelHeader: 'bg-black text-white border-b border-zinc-800',
          modalCardBg: 'bg-zinc-900 text-zinc-100 border-zinc-800',
          modalColBg: 'bg-zinc-950 border-zinc-800',
          modalItemBg: 'bg-zinc-900 border-zinc-700',
          modalTextMain: 'text-zinc-100',
          modalTextSub: 'text-zinc-400'
        },
        pop: {
          bg: 'bg-[#fff5f5]',
          text: 'text-rose-950',
          cardBg: 'bg-white/95 backdrop-blur shadow-sm',
          border: 'border-pink-200',
          headerBg: 'bg-gradient-to-r from-pink-500 via-rose-500 to-pink-600',
          headerText: 'text-white font-bold',
          accentBtn: 'bg-gradient-to-r from-pink-500 to-rose-400 hover:opacity-90 text-white font-bold shadow-md shadow-pink-200',
          actBtn: 'bg-gradient-to-r from-sky-500 to-indigo-500 hover:opacity-90 text-white font-bold shadow-md shadow-sky-200',
          subBtn: 'bg-white/20 hover:bg-white/30 text-white border border-white/40 backdrop-blur-sm',
          thBase: 'bg-pink-100 text-pink-950 border-b border-pink-200',
          thIncome: 'bg-emerald-100 text-emerald-950 border-b border-emerald-200',
          thExpense: 'bg-rose-100 text-rose-950 border-b border-rose-200',
          thTotal: 'bg-purple-100 text-purple-950 border-b border-purple-200 font-black',
          tableRowHover: 'hover:bg-pink-50/80',
          tableBorder: 'border-pink-100',
          chartLine: '#f43f5e',
          inputBg: 'bg-white text-slate-800 border-pink-200 focus:border-rose-400 focus:ring-1 focus:ring-rose-200',
          panelHeader: 'bg-gradient-to-r from-pink-500 to-rose-500 text-white',
          modalCardBg: 'bg-white text-rose-950 border-pink-200',
          modalColBg: 'bg-pink-50/50 border-pink-200',
          modalItemBg: 'bg-white border-pink-200 shadow-sm',
          modalTextMain: 'text-rose-950',
          modalTextSub: 'text-slate-600'
        }
      };

      const currentStyle = themeStyles[theme] || themeStyles.light;
      const isPop = theme === 'pop';

      // 当月生活費合計（円）
      const currentMonthLivingTotal = useMemo(() => {
        const le = currentMonthData.livingExpenses || {};
        return Object.values(le).reduce((sum, v) => sum + (v || 0), 0);
      }, [currentMonthData]);

      // 当月収入合計（円）
      const currentMonthIncomeTotal = useMemo(() => {
        const inc = currentMonthData.income || {};
        return (inc.salary || 0) + (inc.business || 0) + (inc.other || 0);
      }, [currentMonthData]);

      // 当月税保険合計（円）
      const currentMonthTaxTotal = useMemo(() => {
        const ti = currentMonthData.taxInsurance || {};
        return (ti.taxSocial || 0) + (ti.insurance || 0);
      }, [currentMonthData]);

      // 当月末資産合計（円）
      const currentMonthStockTotal = useMemo(() => {
        const sb = currentMonthData.stockBalances || {};
        return (sb.fund || 0) + (sb.cash || 0) + (sb.stock || 0) + (sb.bond || 0);
      }, [currentMonthData]);

      return (
        <div className={`min-h-screen flex flex-col ${currentStyle.bg} ${currentStyle.text} overflow-hidden relative`}>
          
          {/* ヘッダー */}
          <header className={`${currentStyle.headerBg} ${currentStyle.headerText} px-6 py-3.5 flex justify-between items-center shadow-md z-30`}>
            <div className="flex items-center space-x-3">
              {isPop ? <span className="text-2xl animate-bounce">🌸</span> : <i className="fa-solid fa-compass-drafting text-2xl text-teal-400"></i>}
              <h1 className="text-lg font-bold tracking-wider">
                人生100年設計＆資産計画シミュレーター {isPop && '✨'}
              </h1>
            </div>
            <div className="flex items-center space-x-2">
              {/* 実績入力ボタン */}
              <button 
                onClick={() => setActiveDrawer('monthlyActual')}
                className={`${currentStyle.actBtn} px-3.5 py-1.5 rounded-lg text-sm font-bold shadow transition flex items-center space-x-2`}
              >
                {isPop ? <span>📝</span> : <i className="fa-solid fa-file-pen"></i>}
                <span className="hidden sm:inline">月次実績入力</span>
              </button>

              <button 
                onClick={() => setActiveDrawer('analytics')}
                className={`${currentStyle.subBtn} px-3 py-1.5 rounded-lg text-sm font-bold transition flex items-center space-x-1.5`}
              >
                {isPop ? <span>📊</span> : <i className="fa-solid fa-chart-line"></i>}
                <span className="hidden sm:inline">グラフ/AI分析</span>
              </button>

              <button 
                onClick={() => setActiveDrawer('settings')}
                className={`${currentStyle.subBtn} px-3 py-1.5 rounded-lg text-sm font-bold transition flex items-center space-x-1.5`}
              >
                {isPop ? <span>🎛️</span> : <i className="fa-solid fa-sliders"></i>}
                <span className="hidden sm:inline">計画設定</span>
              </button>

              <button 
                onClick={() => setActiveDrawer('appConfig')}
                className={`${currentStyle.accentBtn} px-3 py-1.5 rounded-lg text-sm font-bold shadow transition flex items-center space-x-1`}
                title="アプリ設定"
              >
                {isPop ? <span>🎀</span> : <i className="fa-solid fa-gear"></i>}
                <span className="hidden sm:inline">設定</span>
              </button>
            </div>
          </header>

          <main className="flex-1 p-4 md:p-6 flex flex-col overflow-hidden">

                    {livingPhases.map(phase => (
                      <div key={phase.id} className="flex items-center space-x-1.5 border-b border-slate-200/30 pb-2">
                        <input type="number" value={phase.start} onChange={(e) => livingHandlers.update(phase.id, 'start', e.target.value)} className={`w-16 border rounded p-1 text-center font-bold ${currentStyle.inputBg}`} />歳〜
                        <input type="number" value={phase.end} onChange={(e) => livingHandlers.update(phase.id, 'end', e.target.value)} className={`w-16 border rounded p-1 text-center font-bold ${currentStyle.inputBg}`} />歳
                        <input type="number" value={phase.amount} onChange={(e) => livingHandlers.update(phase.id, 'amount', e.target.value)} className={`w-20 border rounded p-1 text-right font-bold text-rose-500 ml-auto ${currentStyle.inputBg}`} />万
                        <button onClick={() => livingHandlers.remove(phase.id)} className="opacity-40 hover:opacity-100 hover:text-rose-500 px-1"><i className="fa-solid fa-trash"></i></button>
                      </div>
                    ))}
                    <button onClick={livingHandlers.add} className="w-full mt-2 py-1 bg-slate-500/10 hover:bg-slate-500/20 rounded text-center text-[11px] font-bold">
                      <i className="fa-solid fa-plus mr-1"></i>期間を追加
                    </button>
                  </div>
                )}
              </div>

              {/* 年金受給フェーズ */}
              <div className={`border ${currentStyle.border} rounded-lg overflow-hidden`}>
                <button onClick={() => setAccordion({ ...accordion, pension: !accordion.pension })} className="w-full bg-slate-500/10 p-3 text-left font-bold text-xs flex justify-between items-center">
                  <span>{isPop ? '👵 ' : <i className="fa-solid fa-hand-holding-dollar mr-2 text-teal-600"></i>}年金受給フェーズ (万/年)</span>
                  <i className={`fa-solid fa-chevron-down opacity-50 transition-transform ${accordion.pension ? 'rotate-180' : ''}`}></i>
                </button>
                {accordion.pension && (
                  <div className={`p-3 ${currentStyle.cardBg} text-xs border-t ${currentStyle.border} space-y-2`}>
                    {pensionPhases.map(phase => (
                      <div key={phase.id} className="flex items-center space-x-1.5 border-b border-slate-200/30 pb-2">
                        <input type="number" value={phase.start} onChange={(e) => pensionHandlers.update(phase.id, 'start', e.target.value)} className={`w-16 border rounded p-1 text-center font-bold ${currentStyle.inputBg}`} />歳〜
                        <input type="number" value={phase.end} onChange={(e) => pensionHandlers.update(phase.id, 'end', e.target.value)} className={`w-16 border rounded p-1 text-center font-bold ${currentStyle.inputBg}`} />歳
                        <input type="number" value={phase.amount} onChange={(e) => pensionHandlers.update(phase.id, 'amount', e.target.value)} className={`w-20 border rounded p-1 text-right font-bold text-teal-600 ml-auto ${currentStyle.inputBg}`} />万
                        <button onClick={() => pensionHandlers.remove(phase.id)} className="opacity-40 hover:opacity-100 hover:text-rose-500 px-1"><i className="fa-solid fa-trash"></i></button>
                      </div>
                    ))}
                    <button onClick={pensionHandlers.add} className="w-full mt-2 py-1 bg-slate-500/10 hover:bg-slate-500/20 rounded text-center text-[11px] font-bold">
                      <i className="fa-solid fa-plus mr-1"></i>期間を追加
                    </button>
                  </div>
                )}
              </div>

              {/* 特別イベント */}
              <div className={`border ${currentStyle.border} rounded-lg overflow-hidden`}>
                <button onClick={() => setAccordion({ ...accordion, events: !accordion.events })} className="w-full bg-slate-500/10 p-3 text-left font-bold text-xs flex justify-between items-center">
                  <span>{isPop ? '🎉 ' : <i className="fa-solid fa-calendar-check mr-2 text-amber-500"></i>}特別イベント (支出はマイナス)</span>
                  <i className={`fa-solid fa-chevron-down opacity-50 transition-transform ${accordion.events ? 'rotate-180' : ''}`}></i>
                </button>
                {accordion.events && (
                  <div className={`p-3 ${currentStyle.cardBg} text-xs border-t ${currentStyle.border} space-y-2`}>
                    {events.map(event => (
                      <div key={event.id} className="flex items-center space-x-1.5 border-b border-slate-200/30 pb-2">
                        <input type="number" value={event.age} onChange={(e) => updateEvent(event.id, 'age', e.target.value)} className={`w-16 border rounded p-1 text-center font-bold ${currentStyle.inputBg}`} />歳
                        <input type="text" value={event.title} onChange={(e) => updateEvent(event.id, 'title', e.target.value)} className={`flex-1 border rounded p-1 ${currentStyle.inputBg}`} />
                        <input type="number" value={event.amount} onChange={(e) => updateEvent(event.id, 'amount', e.target.value)} className={`w-20 border rounded p-1 text-right font-bold ${currentStyle.inputBg}`} />万
                        <button onClick={() => removeEvent(event.id)} className="opacity-40 hover:opacity-100 hover:text-rose-500 px-1"><i className="fa-solid fa-trash"></i></button>
                      </div>
                    ))}
                    <button onClick={addEvent} className="w-full mt-2 py-1 bg-slate-500/10 hover:bg-slate-500/20 rounded text-center text-[11px] font-bold">
                      <i className="fa-solid fa-plus mr-1"></i>イベントを追加
                    </button>
                  </div>
                )}
              </div>

              {/* 税・保険フェーズ */}
              <div className={`border ${currentStyle.border} rounded-lg overflow-hidden`}>
                <button onClick={() => setAccordion({ ...accordion, tax: !accordion.tax })} className="w-full bg-slate-500/10 p-3 text-left font-bold text-xs flex justify-between items-center">
                  <span>{isPop ? '🛡️ ' : <i className="fa-solid fa-shield-heart mr-2 text-rose-400"></i>}税・社会保険フェーズ (万/年)</span>
                  <i className={`fa-solid fa-chevron-down opacity-50 transition-transform ${accordion.tax ? 'rotate-180' : ''}`}></i>
                </button>
                {accordion.tax && (
                  <div className={`p-3 ${currentStyle.cardBg} text-xs border-t ${currentStyle.border} space-y-2`}>
                    {taxPhases.map(phase => (
                      <div key={phase.id} className="flex items-center space-x-1.5 border-b border-slate-200/30 pb-2">
                        <input type="number" value={phase.start} onChange={(e) => taxHandlers.update(phase.id, 'start', e.target.value)} className={`w-16 border rounded p-1 text-center font-bold ${currentStyle.inputBg}`} />歳〜
                        <input type="number" value={phase.end} onChange={(e) => taxHandlers.update(phase.id, 'end', e.target.value)} className={`w-16 border rounded p-1 text-center font-bold ${currentStyle.inputBg}`} />歳
                        <input type="number" value={phase.amount} onChange={(e) => taxHandlers.update(phase.id, 'amount', e.target.value)} className={`w-20 border rounded p-1 text-right font-bold text-rose-500 ml-auto ${currentStyle.inputBg}`} />万
                        <button onClick={() => taxHandlers.remove(phase.id)} className="opacity-40 hover:opacity-100 hover:text-rose-500 px-1"><i className="fa-solid fa-trash"></i></button>
                      </div>
                    ))}
                    <button onClick={taxHandlers.add} className="w-full mt-2 py-1 bg-slate-500/10 hover:bg-slate-500/20 rounded text-center text-[11px] font-bold">
                      <i className="fa-solid fa-plus mr-1"></i>期間を追加
                    </button>
                  </div>
                )}
              </div>

              {/* マクロ環境 */}
              <div className={`border ${currentStyle.border} rounded-lg overflow-hidden`}>
                <button onClick={() => setAccordion({ ...accordion, macro: !accordion.macro })} className="w-full bg-slate-500/10 p-3 text-left font-bold text-xs flex justify-between items-center">
                  <span>{isPop ? '🌍 ' : <i className="fa-solid fa-earth-americas mr-2 text-indigo-500"></i>}マクロ環境設定</span>
                  <i className={`fa-solid fa-chevron-down opacity-50 transition-transform ${accordion.macro ? 'rotate-180' : ''}`}></i>
                </button>
                {accordion.macro && (
                  <div className={`p-3 ${currentStyle.cardBg} text-xs border-t ${currentStyle.border} space-y-2`}>
                    <div className="flex justify-between items-center">
                      <span className="opacity-70">インフレ率 (物価上昇)</span>
                      <div className="flex items-center space-x-1">
                        <input type="number" step="0.1" value={params.inflationRate} onChange={(e) => setParams({ ...params, inflationRate: parseFloat(e.target.value) || 0 })} className={`w-16 border rounded p-1 text-right font-bold ${currentStyle.inputBg}`} />%
                      </div>
                    </div>
                  </div>
                )}
              </div>

            </div>
          </div>

          {/* ドロワー②：グラフ & AI分析 */}
          <div className={`fixed inset-y-0 right-0 w-full md:w-[500px] ${currentStyle.cardBg} shadow-2xl transform transition-transform duration-300 ease-in-out z-50 flex flex-col ${activeDrawer === 'analytics' ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className={`${currentStyle.panelHeader} p-4 flex justify-between items-center shrink-0`}>
              <h2 className="font-bold text-sm tracking-wide">
                {isPop ? '📊 ' : <i className="fa-solid fa-chart-line mr-2 text-teal-400"></i>}
                資産推移 ＆ AI分析
              </h2>
              <button onClick={() => setActiveDrawer(null)} className="text-white/80 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div className="p-5 overflow-y-auto flex-1 space-y-6">
              <div className="bg-slate-500/5 rounded-xl p-4 border border-slate-200/50">
                <h3 className="text-xs font-bold mb-3">金融資産残高推移 ({profile.startAge}歳〜{profile.endAge}歳)</h3>
                <div className="h-64 w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <LineChart data={simulationData} margin={{ top: 10, right: 20, left: 0, bottom: 0 }}>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#94a3b833" />
                      <XAxis dataKey="age" tickFormatter={(tick) => `${tick}歳`} tick={{ fontSize: 10, fill: '#94a3b8' }} axisLine={false} tickLine={false} />
                      <YAxis tickFormatter={(tick) => `${tick / 10000}億`} tick={{ fontSize: 10, fill: '#94a3b8' }} axisLine={false} tickLine={false} width={40} />
                      <Tooltip formatter={(value) => [`${value.toLocaleString()} 万円`, '年末残高']} labelFormatter={(label) => `${label}歳`} />
                      <ReferenceLine y={0} stroke="#ef4444" strokeDasharray="3 3" />
                      <Line type="monotone" dataKey="endAsset" name="年末残高" stroke={currentStyle.chartLine} strokeWidth={3} dot={false} activeDot={{ r: 5 }} />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              </div>

              <div className={`${isPop ? 'bg-rose-50 border-rose-200 text-rose-900' : 'bg-teal-500/10 border-teal-500/20 text-teal-900 dark:text-teal-100'} border rounded-xl p-5`}>
                <div className="flex items-center space-x-2 mb-3">
                  {isPop ? <span className="text-lg">🤖</span> : <i className="fa-solid fa-robot text-teal-600 text-lg"></i>}
                  <h3 className="text-xs font-bold tracking-wider">AI CFO ライフプラン診断</h3>
                </div>
                <div className="text-xs opacity-80 leading-relaxed space-y-3">
                  <p>
                    選択戦略: <strong className="font-bold">{withdrawalStrategy === 'cashFirst' ? `「現金優先 (最低${minCashReserve}万円維持)」` : '「加重平均リバランス」'}</strong>
                  </p>
                  <p>
                    {profile.endAge}歳時点での予測金融資産残高は <strong className="font-bold">{planFinalAsset.toLocaleString()} 万円</strong> です。
                  </p>
                  {depletionInfo.isDepleted && (
                    <div className="bg-rose-500/10 text-rose-600 p-2.5 rounded-lg border border-rose-500/20 font-bold text-xs">
                      ⚠️ <strong>枯渇リスク検知:</strong> {depletionInfo.year}年（{depletionInfo.age}歳）で金融資産が枯渇する見込みです。支出抑制や追加収入、取り崩し戦略の再検討をおすすめします。
                    </div>
                  )}
                  <div className="bg-white/80 dark:bg-zinc-800/80 p-3 rounded-lg border border-current/20 text-[11px]">
                    💡 <strong>防衛資金クッション効果:</strong><br />
                    手元に{minCashReserve}万円の現金を常に確保しながら運用することで、急な支出にも慌てずリスク資産の複利効果を長期間享受できます。
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* ドロワー③：アプリ設定 */}
          <div className={`fixed inset-y-0 right-0 w-full md:w-96 ${currentStyle.cardBg} shadow-2xl transform transition-transform duration-300 ease-in-out z-50 flex flex-col ${activeDrawer === 'appConfig' ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className={`${currentStyle.panelHeader} p-4 flex justify-between items-center shrink-0`}>
              <h2 className="font-bold text-sm tracking-wide">
                {isPop ? '🎀 ' : <i className="fa-solid fa-gear mr-2 text-teal-400"></i>}
                アプリ設定
              </h2>
              <button onClick={() => setActiveDrawer(null)} className="text-white/80 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div className="p-5 overflow-y-auto flex-1 space-y-6">
              {/* カラーテーマ選択 */}
              <div className="space-y-3">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-60">カラーテーマ選択</h3>
                <div className="grid grid-cols-3 gap-2.5">
                  <button 
                    onClick={() => setTheme('light')}
                    className={`p-3 rounded-xl border text-center transition flex flex-col items-center space-y-2 ${theme === 'light' ? 'border-teal-500 bg-teal-50/20 ring-2 ring-teal-500/30' : 'border-slate-200 hover:bg-slate-500/5'}`}
                  >
                    <div className="w-8 h-8 rounded-full bg-slate-100 border border-slate-300 flex items-center justify-center text-slate-800 shadow-sm">
                      <i className="fa-solid fa-sun text-sm"></i>
                    </div>
                    <span className="text-xs font-bold">ライト</span>
                  </button>

                  <button 
                    onClick={() => setTheme('dark')}
                    className={`p-3 rounded-xl border text-center transition flex flex-col items-center space-y-2 ${theme === 'dark' ? 'border-cyan-500 bg-cyan-950/20 ring-2 ring-cyan-500/30' : 'border-slate-200 hover:bg-slate-500/5'}`}
                  >
                    <div className="w-8 h-8 rounded-full bg-zinc-900 border border-zinc-700 flex items-center justify-center text-cyan-400 shadow-sm">
                      <i className="fa-solid fa-moon text-sm"></i>
                    </div>
                    <span className="text-xs font-bold">ダーク</span>
                  </button>

                  <button 
                    onClick={() => setTheme('pop')}
                    className={`p-3 rounded-xl border text-center transition flex flex-col items-center space-y-2 ${theme === 'pop' ? 'border-pink-500 bg-pink-50 ring-2 ring-pink-400/40' : 'border-slate-200 hover:bg-slate-500/5'}`}
                  >
                    <div className="w-8 h-8 rounded-full bg-gradient-to-r from-pink-400 to-rose-400 text-white flex items-center justify-center shadow-sm">
                      <span>🌸</span>
                    </div>
                    <span className="text-xs font-bold text-rose-600">ポップ</span>
                  </button>
                </div>
              </div>

              {/* 今後拡張用エリア */}
              <div className="pt-4 border-t border-slate-200/40 space-y-3">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-60">データ連携・実績管理設定</h3>
                <div className="bg-slate-500/5 p-3.5 rounded-xl border border-slate-200/40 space-y-2">
                  <div className="flex items-center justify-between text-xs font-bold opacity-80">
                    <span>マネーフォワードCSV連携</span>
                    <span className="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">準備中</span>
                  </div>
                  <p className="text-[11px] opacity-60">
                    月次実績の自動集計やCSV取り込み設定を今後ここに追加します。
                  </p>
                </div>
              </div>

            </div>
          </div>

          {(activeDrawer || selectedYearData) && (
            <div 
              className="fixed inset-0 bg-slate-900/50 z-40 transition-opacity"
              onClick={() => { setActiveDrawer(null); setSelectedYearData(null); }}
            ></div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
