<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生100年設計＆資産計画シミュレーター</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f8fafc; }
    .table-container { max-height: calc(100vh - 270px); overflow-y: auto; }
    thead th { position: sticky; top: 0; z-index: 10; background-color: #f1f5f9; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, PieChart, Pie, Cell } = window.Recharts;

    const App = () => {
      // --- ドロワー・モーダル管理 ---
      const [activeDrawer, setActiveDrawer] = useState(null); // 'settings' | 'analytics' | null
      const [selectedYearData, setSelectedYearData] = useState(null); // 詳細分析モーダル用
      const [accordion, setAccordion] = useState({ portfolio: true, corp: false, living: false, pension: false, tax: false, events: false, macro: false });

      // --- 1. スタート時の資産内訳 ---
      const [portfolio, setPortfolio] = useState({
        cash: { amount: 2000, rate: 0.0 },
        mutualFund: { amount: 3000, rate: 4.0 },
        stock: { amount: 2400, rate: 6.0 }
      });

      const { totalAsset, averageYield } = useMemo(() => {
        const total = portfolio.cash.amount + portfolio.mutualFund.amount + portfolio.stock.amount;
        if (total === 0) return { totalAsset: 0, averageYield: 0 };
        const weightedReturn = (portfolio.cash.amount * portfolio.cash.rate) + (portfolio.mutualFund.amount * portfolio.mutualFund.rate) + (portfolio.stock.amount * portfolio.stock.rate);
        return { totalAsset: total, averageYield: Number((weightedReturn / total).toFixed(2)) };
      }, [portfolio]);

      // --- 2. パラメータ設定 ---
      const [params, setParams] = useState({
        inflationRate: 0.0
      });

      // 法人収益フェーズ
      const [corpPhases, setCorpPhases] = useState([
        { id: 1, start: 56, end: 65, amount: 0 }
      ]);

      // 生活費フェーズ
      const [livingPhases, setLivingPhases] = useState([
        { id: 1, start: 56, end: 69, amount: 300 },
        { id: 2, start: 70, end: 100, amount: 250 }
      ]);

      // 年金受給フェーズ (期間・金額指定)
      const [pensionPhases, setPensionPhases] = useState([
        { id: 1, start: 60, end: 100, amount: 150 }
      ]);

      // 税・保険フェーズ (期間・金額指定)
      const [taxPhases, setTaxPhases] = useState([
        { id: 1, start: 56, end: 64, amount: 66 },
        { id: 2, start: 65, end: 100, amount: 46 }
      ]);

      // 特別イベント
      const [events, setEvents] = useState([
        { id: 1, age: 56, title: '旅・法人設立', amount: -300 },
        { id: 2, age: 58, title: 'マンション売却', amount: 4300 },
        { id: 3, age: 58, title: '新居購入', amount: -6500 },
        { id: 4, age: 60, title: 'iDeCo等', amount: 1000 },
        { id: 5, age: 60, title: 'ポルシェ購入', amount: -800 }
      ]);

      // --- 3. 56歳〜100歳 シミュレーション計算 ---
      const simulationData = useMemo(() => {
        let currentAsset = totalAsset;
        const data = [];
        
        for (let age = 56; age <= 100; age++) {
          const year = 2027 + (age - 56);
          const startAsset = currentAsset;

          // 投資益（税引後 20%控除＝0.8掛け）
          const grossReturn = currentAsset > 0 ? currentAsset * (averageYield / 100) : 0;
          const investmentReturn = grossReturn * 0.8;

          // 年金受給フェーズ判定
          const pensionPhase = pensionPhases.find(p => age >= p.start && age <= p.end);
          const pension = pensionPhase ? pensionPhase.amount : 0;
          
          // 法人収益フェーズ判定
          const corpPhase = corpPhases.find(p => age >= p.start && age <= p.end);
          const corpRev = corpPhase ? corpPhase.amount : 0;

          // 特別イベント
          const yearEvents = events.filter(e => e.age === age);
          const specialIncome = yearEvents.filter(e => e.amount > 0).reduce((sum, e) => sum + e.amount, 0);
          const totalIncome = investmentReturn + pension + corpRev + specialIncome;

          // 生活費フェーズ判定（インフレ加味）
          const livingPhase = livingPhases.find(p => age >= p.start && age <= p.end);
          const baseLiving = livingPhase ? livingPhase.amount : 0;
          const inflatedLiving = baseLiving * Math.pow(1 + params.inflationRate / 100, age - 56);

          // 税・保険フェーズ判定
          const taxPhase = taxPhases.find(p => age >= p.start && age <= p.end);
          const tax = taxPhase ? taxPhase.amount : 0;

          const specialExpense = Math.abs(yearEvents.filter(e => e.amount < 0).reduce((sum, e) => sum + e.amount, 0));
          const totalExpense = inflatedLiving + tax + specialExpense;

          // 年間損益と年末残高
          const profitAndLoss = totalIncome - totalExpense;
          currentAsset = currentAsset + profitAndLoss;
          const eventTitles = yearEvents.map(e => e.title).join(' / ');

          data.push({
            age,
            year,
            startAsset: Math.round(startAsset),
            grossReturn: Math.round(grossReturn),
            investmentReturn: Math.round(investmentReturn),
            pension,
            corpRev,
            specialIncome,
            totalIncome: Math.round(totalIncome),
            livingExpense: Math.round(inflatedLiving),
            tax,
            specialExpense,
            totalExpense: Math.round(totalExpense),
            profitAndLoss: Math.round(profitAndLoss),
            endAsset: Math.round(currentAsset),
            eventTitles
          });
        }
        return data;
      }, [params, corpPhases, livingPhases, pensionPhases, taxPhases, events, totalAsset, averageYield]);

      const plan100Asset = simulationData[simulationData.length - 1]?.endAsset || 0;

      // --- ハンドラー ---
      const handlePortfolioChange = (category, field, value) => {
        setPortfolio({ ...portfolio, [category]: { ...portfolio[category], [field]: parseFloat(value) || 0 } });
      };

      const createPhaseHandlers = (state, setState) => ({
        add: () => setState([...state, { id: Date.now(), start: 56, end: 100, amount: 0 }]),
        remove: (id) => setState(state.filter(p => p.id !== id)),
        update: (id, field, value) => setState(state.map(p => p.id === id ? { ...p, [field]: parseFloat(value) || 0 } : p))
      });

      const corpHandlers = createPhaseHandlers(corpPhases, setCorpPhases);
      const livingHandlers = createPhaseHandlers(livingPhases, setLivingPhases);
      const pensionHandlers = createPhaseHandlers(pensionPhases, setPensionPhases);
      const taxHandlers = createPhaseHandlers(taxPhases, setTaxPhases);

      const addEvent = () => setEvents([...events, { id: Date.now(), age: 60, title: '新規イベント', amount: 0 }]);
      const removeEvent = (id) => setEvents(events.filter(e => e.id !== id));
      const updateEvent = (id, field, value) => setEvents(events.map(e => e.id === id ? { ...e, [field]: field === 'title' ? value : parseFloat(value) || 0 } : e));

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 overflow-hidden relative">
          
          {/* ヘッダー */}
          <header className="bg-slate-900 text-white px-6 py-3.5 flex justify-between items-center shadow-md z-20">
            <div className="flex items-center space-x-3">
              <i className="fa-solid fa-compass-drafting text-2xl text-teal-400"></i>
              <h1 className="text-lg font-bold tracking-wider">人生100年設計＆資産計画シミュレーター</h1>
            </div>
            <div className="flex items-center space-x-3">
              <button 
                onClick={() => setActiveDrawer('analytics')}
                className="bg-slate-800 hover:bg-slate-700 text-teal-300 border border-teal-500/30 px-3.5 py-1.5 rounded-lg text-sm font-bold transition flex items-center space-x-2"
              >
                <i className="fa-solid fa-chart-line"></i>
                <span>グラフ ＆ AI分析</span>
              </button>
              <button 
                onClick={() => setActiveDrawer('settings')}
                className="bg-teal-600 hover:bg-teal-500 text-white px-3.5 py-1.5 rounded-lg text-sm font-bold shadow transition flex items-center space-x-2"
              >
                <i className="fa-solid fa-sliders"></i>
                <span>パラメータ設定</span>
              </button>
            </div>
          </header>

          {/* メインエリア */}
          <main className="flex-1 p-4 md:p-6 flex flex-col overflow-hidden">
            
            {/* 上部：4大サマリーカード */}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 shrink-0">
              <div className="bg-white rounded-xl p-4 shadow-sm border border-slate-200 border-l-4 border-l-blue-500">
                <div className="flex justify-between items-start mb-1">
                  <p className="text-xs font-bold text-slate-500">① スタート時 資産内訳</p>
                  <span className="text-[10px] bg-blue-50 text-blue-600 font-bold px-1.5 py-0.5 rounded">税引後利回り {(averageYield * 0.8).toFixed(2)}%</span>
                </div>
                <div className="text-2xl font-black text-slate-800 tracking-tight">
                  {totalAsset.toLocaleString()} <span className="text-xs font-normal text-slate-500">万円</span>
                </div>
                <div className="mt-2 text-[11px] text-slate-500 flex justify-between border-t border-slate-100 pt-1.5">
                  <span>預金:{portfolio.cash.amount}万</span>
                  <span>投信:{portfolio.mutualFund.amount}万</span>
                  <span>株式:{portfolio.stock.amount}万</span>
                </div>
              </div>

              <div className="bg-white rounded-xl p-4 shadow-sm border border-slate-200 border-l-4 border-l-teal-500">
                <p className="text-xs font-bold text-slate-500 mb-1">② 100歳時点 資産残 (計画)</p>
                <div className={`text-2xl font-black tracking-tight ${plan100Asset < 0 ? 'text-rose-500' : 'text-teal-600'}`}>
                  {plan100Asset.toLocaleString()} <span className="text-xs font-normal text-slate-500">万円</span>
                </div>
                <p className="text-[11px] text-slate-400 mt-2 border-t border-slate-100 pt-1.5">
                  税引後利回り(20%控除)・100歳到達時
                </p>
              </div>

              <div className="bg-white rounded-xl p-4 shadow-sm border border-slate-200 border-l-4 border-l-amber-400 opacity-90">
                <div className="flex justify-between items-start mb-1">
                  <p className="text-xs font-bold text-slate-500">③ 現在の資産内訳</p>
                  <span className="text-[10px] bg-amber-50 text-amber-600 font-bold px-1.5 py-0.5 rounded">実績未入力</span>
                </div>
                <div className="text-2xl font-black text-slate-400 tracking-tight">
                  - <span className="text-xs font-normal text-slate-400">万円</span>
                </div>
                <div className="mt-2 text-[11px] text-slate-400 flex justify-between border-t border-slate-100 pt-1.5">
                  <span>預金:-</span>
                  <span>投信:-</span>
                  <span>株式:-</span>
                </div>
              </div>

              <div className="bg-white rounded-xl p-4 shadow-sm border border-slate-200 border-l-4 border-l-purple-500 opacity-90">
                <p className="text-xs font-bold text-slate-500 mb-1">④ 100歳時点 資産残差額</p>
                <div className="text-2xl font-black text-slate-400 tracking-tight">
                  - <span className="text-xs font-normal text-slate-400">万円</span>
                </div>
                <p className="text-[11px] text-slate-400 mt-2 border-t border-slate-100 pt-1.5">
                  実績反映後の計画上振れ・下振れ差分
                </p>
              </div>
            </div>

            {/* メインテーブル */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden">
              <div className="px-5 py-3 border-b border-slate-200 bg-slate-50/80 flex justify-between items-center">
                <h2 className="text-xs font-bold text-slate-700 uppercase tracking-wider">
                  <i className="fa-solid fa-table-cells mr-2 text-slate-400"></i>年次資金計画表 (56歳〜100歳)
                </h2>
                <span className="text-xs text-slate-400">※行をクリックするとP/L・B/S・C/Fの詳細分析が表示されます</span>
              </div>
              
              <div className="table-container flex-1">
                <table className="w-full text-xs text-right">
                  <thead>
                    <tr className="text-slate-500 border-b border-slate-200 shadow-sm">
                      <th className="p-2.5 text-center w-12">年齢</th>
                      <th className="p-2.5 text-center w-16">西暦</th>
                      <th className="p-2.5 text-slate-700">年初資産</th>
                      <th className="p-2.5 text-teal-700 bg-teal-50/40">投資益(税引)</th>
                      <th className="p-2.5 text-teal-700 bg-teal-50/40">年金</th>
                      <th className="p-2.5 text-teal-700 bg-teal-50/40">法人収益</th>
                      <th className="p-2.5 text-teal-700 bg-teal-50/40">特別収入</th>
                      <th className="p-2.5 text-rose-600 bg-rose-50/40">生活費</th>
                      <th className="p-2.5 text-rose-600 bg-rose-50/40">税・保険</th>
                      <th className="p-2.5 text-rose-600 bg-rose-50/40">特別支出</th>
                      <th className="p-2.5 text-slate-800 font-bold bg-slate-100">年間損益</th>
                      <th className="p-2.5 text-slate-800 font-bold bg-slate-100">年末資産</th>
                      <th className="p-2.5 text-left text-slate-500 w-44">イベント</th>
                      <th className="p-2.5 text-center w-12">詳細</th>
                    </tr>
                  </thead>
                  <tbody>
                    {simulationData.map((row) => (
                      <tr 
                        key={row.age} 
                        onClick={() => setSelectedYearData(row)}
                        className={`border-b border-slate-100 hover:bg-teal-50/50 cursor-pointer transition ${row.endAsset < 0 ? 'bg-rose-50/60' : ''}`}
                      >
                        <td className="p-2.5 text-center font-bold text-slate-700">{row.age}</td>
                        <td className="p-2.5 text-center text-slate-400">{row.year}</td>
                        <td className="p-2.5 font-medium">{row.startAsset.toLocaleString()}</td>
                        <td className="p-2.5 text-teal-600 bg-teal-50/20">{row.investmentReturn.toLocaleString()}</td>
                        <td className="p-2.5 text-teal-600 bg-teal-50/20">{row.pension.toLocaleString()}</td>
                        <td className="p-2.5 text-teal-600 bg-teal-50/20 font-bold">{row.corpRev.toLocaleString()}</td>
                        <td className="p-2.5 text-teal-600 bg-teal-50/20">{row.specialIncome > 0 ? row.specialIncome.toLocaleString() : '-'}</td>
                        <td className="p-2.5 text-rose-500 bg-rose-50/20">{row.livingExpense.toLocaleString()}</td>
                        <td className="p-2.5 text-rose-500 bg-rose-50/20">{row.tax.toLocaleString()}</td>
                        <td className="p-2.5 text-rose-500 bg-rose-50/20">{row.specialExpense > 0 ? row.specialExpense.toLocaleString() : '-'}</td>
                        <td className={`p-2.5 font-bold bg-slate-50 ${row.profitAndLoss < 0 ? 'text-rose-500' : 'text-teal-600'}`}>
                          {row.profitAndLoss > 0 ? '+' : ''}{row.profitAndLoss.toLocaleString()}
                        </td>
                        <td className={`p-2.5 font-bold bg-slate-50 ${row.endAsset < 0 ? 'text-rose-600' : 'text-slate-800'}`}>
                          {row.endAsset.toLocaleString()}
                        </td>
                        <td className="p-2.5 text-left text-slate-500 truncate">{row.eventTitles}</td>
                        <td className="p-2.5 text-center text-teal-600 hover:text-teal-700">
                          <i className="fa-solid fa-chart-pie"></i>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* 年次詳細分析モーダル (P/L, B/S, C/F) */}
          {selectedYearData && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-200">
                <div className="bg-slate-900 text-white p-5 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <span className="bg-teal-500 text-slate-900 font-black px-2.5 py-1 rounded text-sm">{selectedYearData.age}歳</span>
                    <h2 className="text-lg font-bold">{selectedYearData.year}年 財務3表詳細分析 (P/L・B/S・C/F)</h2>
                  </div>
                  <button onClick={() => setSelectedYearData(null)} className="text-slate-400 hover:text-white text-xl">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="p-6 grid grid-cols-1 md:grid-cols-3 gap-6 max-h-[80vh] overflow-y-auto">
                  
                  {/* P/L (損益計算書) */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-200">
                        <h3 className="text-sm font-bold text-slate-800"><i className="fa-solid fa-receipt mr-1.5 text-teal-600"></i>P/L (損益計算書)</h3>
                        <span className={`text-xs font-bold ${selectedYearData.profitAndLoss >= 0 ? 'text-teal-600' : 'text-rose-500'}`}>
                          年間: {selectedYearData.profitAndLoss >= 0 ? '+' : ''}{selectedYearData.profitAndLoss.toLocaleString()}万
                        </span>
                      </div>
                      <div className="space-y-1.5 text-xs text-slate-600">
                        <div className="flex justify-between text-teal-700 font-medium"><span>収入計</span><span>+{selectedYearData.totalIncome.toLocaleString()}万</span></div>
                        <div className="pl-2 flex justify-between text-slate-400"><span>・投資益(税引)</span><span>+{selectedYearData.investmentReturn.toLocaleString()}万</span></div>
                        <div className="pl-2 flex justify-between text-slate-400"><span>・年金受給</span><span>+{selectedYearData.pension.toLocaleString()}万</span></div>
                        <div className="pl-2 flex justify-between text-slate-400"><span>・法人収益</span><span>+{selectedYearData.corpRev.toLocaleString()}万</span></div>
                        {selectedYearData.specialIncome > 0 && (
                          <div className="pl-2 flex justify-between text-slate-400"><span>・特別収入</span><span>+{selectedYearData.specialIncome.toLocaleString()}万</span></div>
                        )}
                        <div className="flex justify-between text-rose-600 font-medium pt-2 border-t border-slate-200"><span>支出計</span><span>-{selectedYearData.totalExpense.toLocaleString()}万</span></div>
                        <div className="pl-2 flex justify-between text-slate-400"><span>・生活費</span><span>-{selectedYearData.livingExpense.toLocaleString()}万</span></div>
                        <div className="pl-2 flex justify-between text-slate-400"><span>・税・社会保険</span><span>-{selectedYearData.tax.toLocaleString()}万</span></div>
                        {selectedYearData.specialExpense > 0 && (
                          <div className="pl-2 flex justify-between text-slate-400"><span>・特別支出</span><span>-{selectedYearData.specialExpense.toLocaleString()}万</span></div>
                        )}
                      </div>
                    </div>
                    {/* 支出内訳円グラフ */}
                    <div className="h-32 mt-4 pt-2 border-t border-slate-200">
                      <ResponsiveContainer width="100%" height="100%">
                        <PieChart>
                          <Pie 
                            data={[
                              { name: '生活費', value: selectedYearData.livingExpense },
                              { name: '税・保険', value: selectedYearData.tax },
                              { name: '特別支出', value: selectedYearData.specialExpense }
                            ].filter(d => d.value > 0)} 
                            dataKey="value" 
                            cx="50%" 
                            cy="50%" 
                            innerRadius={25} 
                            outerRadius={45} 
                            paddingAngle={3}
                          >
                            <Cell fill="#f43f5e" />
                            <Cell fill="#fb7185" />
                            <Cell fill="#fda4af" />
                          </Pie>
                          <Tooltip formatter={(v) => `${v.toLocaleString()}万`} />
                        </PieChart>
                      </ResponsiveContainer>
                    </div>
                  </div>

                  {/* B/S (貸借対照表 - 金融資産のみ) */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-200">
                        <h3 className="text-sm font-bold text-slate-800"><i className="fa-solid fa-scale-balanced mr-1.5 text-blue-600"></i>B/S (年末バランスシート)</h3>
                        <span className="text-xs font-bold text-slate-700">{selectedYearData.endAsset.toLocaleString()}万</span>
                      </div>
                      <div className="space-y-3 text-xs">
                        <div className="bg-white p-3 rounded-lg border border-slate-200">
                          <p className="text-[10px] font-bold text-slate-400 uppercase">資産の部 (金融資産のみ)</p>
                          <div className="mt-1 flex justify-between text-slate-700 font-black text-sm">
                            <span>流動・運用資産合計</span>
                            <span>{selectedYearData.endAsset.toLocaleString()} 万円</span>
                          </div>
                          <p className="text-[10px] text-slate-400 mt-1">※不動産等の固定資産を含まない金融資産純高</p>
                        </div>
                        <div className="bg-white p-3 rounded-lg border border-slate-200">
                          <p className="text-[10px] font-bold text-slate-400 uppercase">純資産の部</p>
                          <div className="mt-1 flex justify-between text-blue-600 font-black text-sm">
                            <span>純資産合計</span>
                            <span>{selectedYearData.endAsset.toLocaleString()} 万円</span>
                          </div>
                          <div className="mt-1 flex justify-between text-[11px] text-slate-400 border-t pt-1">
                            <span>年初からの純資産増減</span>
                            <span className={selectedYearData.profitAndLoss >= 0 ? 'text-teal-600 font-bold' : 'text-rose-500 font-bold'}>
                              {selectedYearData.profitAndLoss >= 0 ? '+' : ''}{selectedYearData.profitAndLoss.toLocaleString()}万
                            </span>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div className="bg-blue-50/50 p-3 rounded text-[11px] text-blue-800 mt-4">
                      💡 <strong>自己資本比率: 100%</strong> (負債ゼロ運用)
                    </div>
                  </div>

                  {/* C/F (キャッシュフロー計算書) */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-200">
                        <h3 className="text-sm font-bold text-slate-800"><i className="fa-solid fa-money-bill-transfer mr-1.5 text-purple-600"></i>C/F (キャッシュフロー)</h3>
                        <span className="text-xs font-bold text-purple-600">Net: {selectedYearData.profitAndLoss.toLocaleString()}万</span>
                      </div>
                      <div className="space-y-2 text-xs">
                        <div className="bg-white p-2.5 rounded border border-slate-200">
                          <span className="font-bold text-slate-700 block">基礎生活 C/F</span>
                          <span className="text-slate-400 text-[10px]">年金 + 法人収益 - 生活費 - 税</span>
                          <div className="text-right font-bold text-slate-800 mt-1">
                            {(selectedYearData.pension + selectedYearData.corpRev - selectedYearData.livingExpense - selectedYearData.tax).toLocaleString()} 万円
                          </div>
                        </div>
                        <div className="bg-white p-2.5 rounded border border-slate-200">
                          <span className="font-bold text-slate-700 block">投資運用 C/F</span>
                          <span className="text-slate-400 text-[10px]">税引後投資インカム益</span>
                          <div className="text-right font-bold text-teal-600 mt-1">
                            +{selectedYearData.investmentReturn.toLocaleString()} 万円
                          </div>
                        </div>
                        <div className="bg-white p-2.5 rounded border border-slate-200">
                          <span className="font-bold text-slate-700 block">特別イベント C/F</span>
                          <span className="text-slate-400 text-[10px]">売却収入・購入支出等</span>
                          <div className="text-right font-bold text-slate-800 mt-1">
                            {(selectedYearData.specialIncome - selectedYearData.specialExpense).toLocaleString()} 万円
                          </div>
                        </div>
                      </div>
                    </div>
                    <div className="text-right text-[11px] text-slate-400 mt-4">
                      期末現金・運用資産残高に全額連動
                    </div>
                  </div>

                </div>
              </div>
            </div>
          )}

          {/* ドロワー①：パラメータ設定 */}
          <div className={`fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl transform transition-transform duration-300 ease-in-out z-50 flex flex-col ${activeDrawer === 'settings' ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className="bg-slate-900 text-white p-4 flex justify-between items-center shrink-0">
              <h2 className="font-bold text-sm tracking-wide"><i className="fa-solid fa-sliders mr-2 text-teal-400"></i>パラメータ調整</h2>
              <button onClick={() => setActiveDrawer(null)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div className="p-4 overflow-y-auto flex-1 space-y-4">
              
              {/* 資産内訳 */}
              <div className="border border-slate-200 rounded-lg overflow-hidden">
                <button onClick={() => setAccordion({ ...accordion, portfolio: !accordion.portfolio })} className="w-full bg-slate-50 p-3 text-left font-bold text-xs text-slate-700 flex justify-between items-center">
                  <span><i className="fa-solid fa-pie-chart mr-2 text-blue-500"></i>初期資産ポートフォリオ</span>
                  <i className={`fa-solid fa-chevron-down text-slate-400 transition-transform ${accordion.portfolio ? 'rotate-180' : ''}`}></i>
                </button>
                {accordion.portfolio && (
                  <div className="p-3 space-y-2 bg-white text-xs border-t border-slate-100">
                    <div className="flex justify-between items-center">
                      <span className="text-slate-500">現金・預金</span>
                      <div className="flex items-center space-x-1">
                        <input type="number" value={portfolio.cash.amount} onChange={(e) => handlePortfolioChange('cash', 'amount', e.target.value)} className="w-16 text-right border rounded p-1" />万
                        <input type="number" step="0.1" value={portfolio.cash.rate} onChange={(e) => handlePortfolioChange('cash', 'rate', e.target.value)} className="w-12 text-right border rounded p-1" />%
                      </div>
                    </div>
                    <div className="flex justify-between items-center">
                      <span className="text-slate-500">投資信託</span>
                      <div className="flex items-center space-x-1">
                        <input type="number" value={portfolio.mutualFund.amount} onChange={(e) => handlePortfolioChange('mutualFund', 'amount', e.target.value)} className="w-16 text-right border rounded p-1" />万
                        <input type="number" step="0.1" value={portfolio.mutualFund.rate} onChange={(e) => handlePortfolioChange('mutualFund', 'rate', e.target.value)} className="w-12 text-right border rounded p-1" />%
                      </div>
                    </div>
                    <div className="flex justify-between items-center">
                      <span className="text-slate-500">個別株式</span>
                      <div className="flex items-center space-x-1">
                        <input type="number" value={portfolio.stock.amount} onChange={(e) => handlePortfolioChange('stock', 'amount', e.target.value)} className="w-16 text-right border rounded p-1" />万
                        <input type="number" step="0.1" value={portfolio.stock.rate} onChange={(e) => handlePortfolioChange('stock', 'rate', e.target.value)} className="w-12 text-right border rounded p-1" />%
                      </div>
                    </div>
                    <p className="text-[10px] text-teal-600 text-right mt-1">※シミュレーション計算時は税引後(20%控除)で計算</p>
                  </div>
                )}
              </div>

              {/* 法人収益フェーズ */}
              <div className="border border-slate-200 rounded-lg overflow-hidden">
                <button onClick={() => setAccordion({ ...accordion, corp: !accordion.corp })} className="w-full bg-slate-50 p-3 text-left font-bold text-xs text-slate-700 flex justify-between items-center">
                  <span><i className="fa-solid fa-rocket mr-2 text-teal-500"></i>マイクロ法人収益フェーズ</span>
                  <i className={`fa-solid fa-chevron-down text-slate-400 transition-transform ${accordion.corp ? 'rotate-180' : ''}`}></i>
                </button>
                {accordion.corp && (
                  <div className="p-3 bg-white text-xs border-t border-slate-100 space-y-2">
                    {corpPhases.map(phase => (
                      <div key={phase.id} className="flex items-center space-x-1 border-b border-slate-50 pb-2">
                        <input type="number" value={phase.start} onChange={(e) => corpHandlers.update(phase.id, 'start', e.target.value)} className="w-10 border rounded p-1 text-center" />歳〜
                        <input type="number" value={phase.end} onChange={(e) => corpHandlers.update(phase.id, 'end', e.target.value)} className="w-10 border rounded p-1 text-center" />歳
                        <input type="number" value={phase.amount} onChange={(e) => corpHandlers.update(phase.id, 'amount', e.target.value)} className="w-14 border rounded p-1 text-right font-bold text-teal-600 ml-auto" />万
                        <button onClick={() => corpHandlers.remove(phase.id)} className="text-slate-300 hover:text-rose-500 px-1"><i className="fa-solid fa-trash"></i></button>
                      </div>
                    ))}
                    <button onClick={corpHandlers.add} className="w-full mt-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-center text-[11px] font-bold">
                      <i className="fa-solid fa-plus mr-1"></i>期間を追加
                    </button>
                  </div>
                )}
              </div>

              {/* 年代別生活費 */}
              <div className="border border-slate-200 rounded-lg overflow-hidden">
                <button onClick={() => setAccordion({ ...accordion, living: !accordion.living })} className="w-full bg-slate-50 p-3 text-left font-bold text-xs text-slate-700 flex justify-between items-center">
                  <span><i className="fa-solid fa-house-chimney mr-2 text-rose-500"></i>生活費フェーズ (万/年)</span>
                  <i className={`fa-solid fa-chevron-down text-slate-400 transition-transform ${accordion.living ? 'rotate-180' : ''}`}></i>
                </button>
                {accordion.living && (
                  <div className="p-3 bg-white text-xs border-t border-slate-100 space-y-2">
                    {livingPhases.map(phase => (
                      <div key={phase.id} className="flex items-center space-x-1 border-b border-slate-50 pb-2">
                        <input type="number" value={phase.start} onChange={(e) => livingHandlers.update(phase.id, 'start', e.target.value)} className="w-10 border rounded p-1 text-center" />歳〜
                        <input type="number" value={phase.end} onChange={(e) => livingHandlers.update(phase.id, 'end', e.target.value)} className="w-10 border rounded p-1 text-center" />歳
                        <input type="number" value={phase.amount} onChange={(e) => livingHandlers.update(phase.id, 'amount', e.target.value)} className="w-14 border rounded p-1 text-right font-bold text-rose-500 ml-auto" />万
                        <button onClick={() => livingHandlers.remove(phase.id)} className="text-slate-300 hover:text-rose-500 px-1"><i className="fa-solid fa-trash"></i></button>
                      </div>
                    ))}
                    <button onClick={livingHandlers.add} className="w-full mt-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-center text-[11px] font-bold">
                      <i className="fa-solid fa-plus mr-1"></i>期間を追加
                    </button>
                  </div>
                )}
              </div>

              {/* 年金受給フェーズ */}
              <div className="border border-slate-200 rounded-lg overflow-hidden">
                <button onClick={() => setAccordion({ ...accordion, pension: !accordion.pension })} className="w-full bg-slate-50 p-3 text-left font-bold text-xs text-slate-700 flex justify-between items-center">
                  <span><i className="fa-solid fa-hand-holding-dollar mr-2 text-teal-600"></i>年金受給フェーズ (万/年)</span>
                  <i className={`fa-solid fa-chevron-down text-slate-400 transition-transform ${accordion.pension ? 'rotate-180' : ''}`}></i>
                </button>
                {accordion.pension && (
                  <div className="p-3 bg-white text-xs border-t border-slate-100 space-y-2">
                    {pensionPhases.map(phase => (
                      <div key={phase.id} className="flex items-center space-x-1 border-b border-slate-50 pb-2">
                        <input type="number" value={phase.start} onChange={(e) => pensionHandlers.update(phase.id, 'start', e.target.value)} className="w-10 border rounded p-1 text-center" />歳〜
                        <input type="number" value={phase.end} onChange={(e) => pensionHandlers.update(phase.id, 'end', e.target.value)} className="w-10 border rounded p-1 text-center" />歳
                        <input type="number" value={phase.amount} onChange={(e) => pensionHandlers.update(phase.id, 'amount', e.target.value)} className="w-14 border rounded p-1 text-right font-bold text-teal-600 ml-auto" />万
                        <button onClick={() => pensionHandlers.remove(phase.id)} className="text-slate-300 hover:text-rose-500 px-1"><i className="fa-solid fa-trash"></i></button>
                      </div>
                    ))}
                    <button onClick={pensionHandlers.add} className="w-full mt-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-center text-[11px] font-bold">
                      <i className="fa-solid fa-plus mr-1"></i>期間を追加
                    </button>
                  </div>
                )}
              </div>

              {/* 税・保険フェーズ */}
              <div className="border border-slate-200 rounded-lg overflow-hidden">
                <button onClick={() => setAccordion({ ...accordion, tax: !accordion.tax })} className="w-full bg-slate-50 p-3 text-left font-bold text-xs text-slate-700 flex justify-between items-center">
                  <span><i className="fa-solid fa-shield-heart mr-2 text-rose-400"></i>税・社会保険フェーズ (万/年)</span>
                  <i className={`fa-solid fa-chevron-down text-slate-400 transition-transform ${accordion.tax ? 'rotate-180' : ''}`}></i>
                </button>
                {accordion.tax && (
                  <div className="p-3 bg-white text-xs border-t border-slate-100 space-y-2">
                    {taxPhases.map(phase => (
                      <div key={phase.id} className="flex items-center space-x-1 border-b border-slate-50 pb-2">
                        <input type="number" value={phase.start} onChange={(e) => taxHandlers.update(phase.id, 'start', e.target.value)} className="w-10 border rounded p-1 text-center" />歳〜
                        <input type="number" value={phase.end} onChange={(e) => taxHandlers.update(phase.id, 'end', e.target.value)} className="w-10 border rounded p-1 text-center" />歳
                        <input type="number" value={phase.amount} onChange={(e) => taxHandlers.update(phase.id, 'amount', e.target.value)} className="w-14 border rounded p-1 text-right font-bold text-rose-500 ml-auto" />万
                        <button onClick={() => taxHandlers.remove(phase.id)} className="text-slate-300 hover:text-rose-500 px-1"><i className="fa-solid fa-trash"></i></button>
                      </div>
                    ))}
                    <button onClick={taxHandlers.add} className="w-full mt-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-center text-[11px] font-bold">
                      <i className="fa-solid fa-plus mr-1"></i>期間を追加
                    </button>
                  </div>
                )}
              </div>

              {/* 特別イベント */}
              <div className="border border-slate-200 rounded-lg overflow-hidden">
                <button onClick={() => setAccordion({ ...accordion, events: !accordion.events })} className="w-full bg-slate-50 p-3 text-left font-bold text-xs text-slate-700 flex justify-between items-center">
                  <span><i className="fa-solid fa-calendar-check mr-2 text-amber-500"></i>特別イベント (支出はマイナス)</span>
                  <i className={`fa-solid fa-chevron-down text-slate-400 transition-transform ${accordion.events ? 'rotate-180' : ''}`}></i>
                </button>
                {accordion.events && (
                  <div className="p-3 bg-white text-xs border-t border-slate-100 space-y-2">
                    {events.map(event => (
                      <div key={event.id} className="flex items-center space-x-1 border-b border-slate-50 pb-2">
                        <input type="number" value={event.age} onChange={(e) => updateEvent(event.id, 'age', e.target.value)} className="w-10 border rounded p-1 text-center" />歳
                        <input type="text" value={event.title} onChange={(e) => updateEvent(event.id, 'title', e.target.value)} className="flex-1 border rounded p-1" />
                        <input type="number" value={event.amount} onChange={(e) => updateEvent(event.id, 'amount', e.target.value)} className="w-14 border rounded p-1 text-right font-bold" />万
                        <button onClick={() => removeEvent(event.id)} className="text-slate-300 hover:text-rose-500 px-1"><i className="fa-solid fa-trash"></i></button>
                      </div>
                    ))}
                    <button onClick={addEvent} className="w-full mt-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-center text-[11px] font-bold">
                      <i className="fa-solid fa-plus mr-1"></i>イベントを追加
                    </button>
                  </div>
                )}
              </div>

              {/* マクロ環境 */}
              <div className="border border-slate-200 rounded-lg overflow-hidden">
                <button onClick={() => setAccordion({ ...accordion, macro: !accordion.macro })} className="w-full bg-slate-50 p-3 text-left font-bold text-xs text-slate-700 flex justify-between items-center">
                  <span><i className="fa-solid fa-earth-americas mr-2 text-indigo-500"></i>マクロ環境設定</span>
                  <i className={`fa-solid fa-chevron-down text-slate-400 transition-transform ${accordion.macro ? 'rotate-180' : ''}`}></i>
                </button>
                {accordion.macro && (
                  <div className="p-3 bg-white text-xs border-t border-slate-100 space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="text-slate-500">インフレ率 (物価上昇)</span>
                      <div className="flex items-center space-x-1">
                        <input type="number" step="0.1" value={params.inflationRate} onChange={(e) => setParams({ ...params, inflationRate: parseFloat(e.target.value) || 0 })} className="w-14 border rounded p-1 text-right" />%
                      </div>
                    </div>
                  </div>
                )}
              </div>

            </div>
          </div>

          {/* ドロワー②：グラフ & AI分析 */}
          <div className={`fixed inset-y-0 right-0 w-full md:w-[500px] bg-white shadow-2xl transform transition-transform duration-300 ease-in-out z-50 flex flex-col ${activeDrawer === 'analytics' ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className="bg-slate-900 text-white p-4 flex justify-between items-center shrink-0">
              <h2 className="font-bold text-sm tracking-wide"><i className="fa-solid fa-chart-line mr-2 text-teal-400"></i>人生100年 資産推移 ＆ AI分析</h2>
              <button onClick={() => setActiveDrawer(null)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div className="p-5 overflow-y-auto flex-1 space-y-6">
              
              {/* グラフエリア */}
              <div className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                <h3 className="text-xs font-bold text-slate-700 mb-3">金融資産残高推移 (56歳〜100歳)</h3>
                <div className="h-64 w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <LineChart data={simulationData} margin={{ top: 10, right: 20, left: 0, bottom: 0 }}>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                      <XAxis dataKey="age" tickFormatter={(tick) => `${tick}歳`} tick={{ fontSize: 10, fill: '#64748b' }} axisLine={false} tickLine={false} />
                      <YAxis tickFormatter={(tick) => `${tick / 10000}億`} tick={{ fontSize: 10, fill: '#64748b' }} axisLine={false} tickLine={false} width={40} />
                      <Tooltip formatter={(value) => [`${value.toLocaleString()} 万円`, '年末残高']} labelFormatter={(label) => `${label}歳`} />
                      <ReferenceLine y={0} stroke="#ef4444" strokeDasharray="3 3" />
                      <Line type="monotone" dataKey="endAsset" name="年末残高" stroke="#0d9488" strokeWidth={3} dot={false} activeDot={{ r: 5 }} />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              </div>

              {/* AI分析レポート */}
              <div className="bg-teal-50/50 border border-teal-200/70 rounded-xl p-5">
                <div className="flex items-center space-x-2 mb-3">
                  <i className="fa-solid fa-robot text-teal-600 text-lg"></i>
                  <h3 className="text-xs font-bold text-teal-900 tracking-wider">AI CFO ライフプラン診断</h3>
                </div>
                <div className="text-xs text-slate-700 leading-relaxed space-y-3">
                  <p>
                    税引後利回りを考慮した100歳時点での金融資産残高は <strong className="text-teal-700 font-bold">{plan100Asset.toLocaleString()} 万円</strong> の予測です。
                  </p>
                  <p>
                    各年をクリックしてP/L・B/S・C/Fを点検することで、どのライフイベントがキャッシュフローに大きく影響しているかを把握できます。
                  </p>
                  <div className="bg-white p-3 rounded-lg border border-teal-100 text-[11px] text-slate-600">
                    💡 <strong>分析のポイント:</strong><br />
                    年金受給と生活費のバランスが取れると基礎C/Fが安定し、100歳までの長生きリスクに備えた強固な土台が完成します。
                  </div>
                </div>
              </div>

            </div>
          </div>

          {/* 背景オーバーレイ */}
          {(activeDrawer || selectedYearData) && (
            <div 
              className="fixed inset-0 bg-slate-900/40 z-40 transition-opacity"
              onClick={() => { setActiveDrawer(null); setSelectedYearData(null); }}
            ></div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
