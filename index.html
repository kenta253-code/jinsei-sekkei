<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生100年設計＆資産計画シミュレーター</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .table-container { max-height: calc(100vh - 270px); overflow-y: auto; }
    thead th { position: sticky; top: 0; z-index: 20; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, PieChart, Pie, Cell } = window.Recharts;

    // --- カンマ付き数値入力コンポーネント ---
    const CurrencyInput = ({ value, onChange, placeholder = "0", className = "", style = {} }) => {
      const displayValue = useMemo(() => {
        if (value === 0 || value === '0') return '0';
        if (!value && value !== 0) return '';
        const num = String(value).replace(/,/g, '');
        return isNaN(num) ? '' : Number(num).toLocaleString();
      }, [value]);

      const handleChange = (e) => {
        const raw = e.target.value.replace(/,/g, '');
        if (raw === '' || /^-?\d*$/.test(raw)) {
          onChange(raw === '' ? 0 : Number(raw));
        }
      };

      return (
        <input
          type="text"
          value={displayValue}
          onChange={handleChange}
          placeholder={placeholder}
          className={className}
          style={style}
        />
      );
    };

    const App = () => {
      // --- テーマ管理 (localStorage 保存) ---
      const [theme, setTheme] = useState(() => localStorage.getItem('app_theme') || 'light');

      useEffect(() => {
        localStorage.setItem('app_theme', theme);
      }, [theme]);

      // --- ドロワー・モーダル管理 ---
      const [activeDrawer, setActiveDrawer] = useState(null); // 'settings' | 'analytics' | 'appConfig' | 'monthlyActual' | null
      const [selectedYearData, setSelectedYearData] = useState(null);
      const [accordion, setAccordion] = useState({ profile: true, portfolio: true, corp: false, living: false, pension: false, tax: false, events: false, macro: false });

      // 月次入力アコーディオン開閉状態
      const [actAccordion, setActAccordion] = useState({
        stock: true,
        income: true,
        living: true,
        large: false,
        tax: true
      });

      // --- 基本プロファイル ---
      const [profile, setProfile] = useState({
        startYear: 2027,
        startAge: 56,
        endAge: 100
      });

      // 計算方式: 'weighted' | 'cashFirst'
      const [withdrawalStrategy, setWithdrawalStrategy] = useState('cashFirst');
      const [minCashReserve, setMinCashReserve] = useState(500);

      // 初期資産ポートフォリオ（当初計画用）
      const [portfolio, setPortfolio] = useState({
        cash: { amount: 3000, rate: 0.0 },
        mutualFund: { amount: 4000, rate: 3.0 },
        stock: { amount: 500, rate: 3.0 }
      });

      const { totalAsset, averageYield } = useMemo(() => {
        const total = portfolio.cash.amount + portfolio.mutualFund.amount + portfolio.stock.amount;
        if (total === 0) return { totalAsset: 0, averageYield: 0 };
        const weightedReturn = (portfolio.cash.amount * portfolio.cash.rate) + (portfolio.mutualFund.amount * portfolio.mutualFund.rate) + (portfolio.stock.amount * portfolio.stock.rate);
        return { totalAsset: total, averageYield: Number((weightedReturn / total).toFixed(2)) };
      }, [portfolio]);

      const [params, setParams] = useState({ inflationRate: 0.0 });
      
      const [incomePhases, setIncomePhases] = useState([
        { id: 1, start: 56, end: 65, amount: 0 }
      ]);
      
      const [livingPhases, setLivingPhases] = useState([
        { id: 1, start: 56, end: 69, amount: 300 },
        { id: 2, start: 70, end: 100, amount: 250 }
      ]);
      const [pensionPhases, setPensionPhases] = useState([{ id: 1, start: 60, end: 100, amount: 150 }]);
      const [taxPhases, setTaxPhases] = useState([
        { id: 1, start: 56, end: 64, amount: 66 },
        { id: 2, start: 65, end: 100, amount: 46 }
      ]);
      const [events, setEvents] = useState([
        { id: 1, age: 56, title: '旅・法人設立', amount: -300 },
        { id: 2, age: 58, title: 'マンション売却', amount: 4300 },
        { id: 3, age: 58, title: '新居購入', amount: -6500 },
        { id: 4, age: 60, title: 'iDeCo等', amount: 1000 },
        { id: 5, age: 60, title: 'ポルシェ購入', amount: -800 }
      ]);

      // --- 月次実績データ (localStorage 保存) ---
      const [monthlyActuals, setMonthlyActuals] = useState(() => {
        const saved = localStorage.getItem('monthly_actuals');
        return saved ? JSON.parse(saved) : {};
      });

      useEffect(() => {
        localStorage.setItem('monthly_actuals', JSON.stringify(monthlyActuals));
      }, [monthlyActuals]);

      const [selectedActYear, setSelectedActYear] = useState(2026);
      const [selectedActMonth, setSelectedActMonth] = useState(8);

      const currentActKey = `${selectedActYear}-${String(selectedActMonth).padStart(2, '0')}`;

      // デフォルトの項目テンプレート
      const defaultMonthlyData = {
        stockBalances: [
          { id: 'fund', title: '投資信託', amount: 0, isFixed: true, color: 'bg-orange-500' },
          { id: 'cash', title: '預金・現金', amount: 0, isFixed: true, color: 'bg-blue-500' },
          { id: 'stock', title: '株式(現物)', amount: 0, isFixed: true, color: 'bg-red-500' },
          { id: 'bond', title: '債券', amount: 0, isFixed: true, color: 'bg-cyan-500' }
        ],
        income: [
          { id: 'salary', title: '給料・賞与', amount: 0, isFixed: true },
          { id: 'business', title: '事業・役員報酬等', amount: 0, isFixed: true },
          { id: 'other', title: 'その他収入', amount: 0, isFixed: true }
        ],
        livingExpenses: [
          { id: 'housing', title: '住宅', amount: 0, isFixed: true },
          { id: 'food', title: '食費', amount: 0, isFixed: true },
          { id: 'cashCard', title: '現金・カード', amount: 0, isFixed: true },
          { id: 'hobby', title: '趣味・娯楽', amount: 0, isFixed: true },
          { id: 'transport', title: '交通費', amount: 0, isFixed: true },
          { id: 'dailyGoods', title: '日用品', amount: 0, isFixed: true },
          { id: 'utility', title: '水道・光熱費', amount: 0, isFixed: true },
          { id: 'communication', title: '通信費', amount: 0, isFixed: true },
          { id: 'social', title: '交際費', amount: 0, isFixed: true },
          { id: 'beauty', title: '衣服・美容', amount: 0, isFixed: true },
          { id: 'medical', title: '健康・医療', amount: 0, isFixed: true },
          { id: 'education', title: '教養・教育', amount: 0, isFixed: true },
          { id: 'insurance', title: '保険（生命・損害等）', amount: 0, isFixed: true },
          { id: 'otherLiving', title: 'その他', amount: 0, isFixed: true }
        ],
        largeExpenses: [],
        taxInsurance: [
          { id: 'tax', title: '税金', amount: 0, isFixed: true },
          { id: 'social', title: '社会保険等', amount: 0, isFixed: true }
        ]
      };

      const currentMonthData = useMemo(() => {
        const raw = monthlyActuals[currentActKey];
        if (!raw) return defaultMonthlyData;

        const normalizeList = (savedList, defaultList) => {
          if (Array.isArray(savedList)) return savedList;
          if (typeof savedList === 'object' && savedList !== null) {
            return defaultList.map(def => ({
              ...def,
              amount: savedList[def.id] || 0
            }));
          }
          return defaultList;
        };

        return {
          stockBalances: normalizeList(raw.stockBalances, defaultMonthlyData.stockBalances),
          income: normalizeList(raw.income, defaultMonthlyData.income),
          livingExpenses: normalizeList(raw.livingExpenses, defaultMonthlyData.livingExpenses),
          largeExpenses: Array.isArray(raw.largeExpenses) ? raw.largeExpenses : [],
          taxInsurance: normalizeList(raw.taxInsurance, defaultMonthlyData.taxInsurance)
        };
      }, [monthlyActuals, currentActKey]);

      const updateListItem = (category, id, field, value) => {
        const list = currentMonthData[category] || [];
        const updated = list.map(item => item.id === id ? { ...item, [field]: value } : item);
        setMonthlyActuals({
          ...monthlyActuals,
          [currentActKey]: {
            ...currentMonthData,
            [category]: updated
          }
        });
      };

      const addListItem = (category, defaultTitle = '新規項目') => {
        const list = currentMonthData[category] || [];
        const newItem = {
          id: `custom_${Date.now()}`,
          title: defaultTitle,
          amount: 0,
          isFixed: false
        };
        setMonthlyActuals({
          ...monthlyActuals,
          [currentActKey]: {
            ...currentMonthData,
            [category]: [...list, newItem]
          }
        });
      };

      const removeListItem = (category, id) => {
        const list = currentMonthData[category] || [];
        const updated = list.filter(item => item.id !== id);
        setMonthlyActuals({
          ...monthlyActuals,
          [currentActKey]: {
            ...currentMonthData,
            [category]: updated
          }
        });
      };

      // 月次集計計算
      const currentStockTotal = useMemo(() => {
        return (currentMonthData.stockBalances || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentMonthData.stockBalances]);

      const currentIncomeTotal = useMemo(() => {
        return (currentMonthData.income || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentMonthData.income]);

      const currentLivingTotal = useMemo(() => {
        return (currentMonthData.livingExpenses || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentMonthData.livingExpenses]);

      const currentLargeTotal = useMemo(() => {
        return (currentMonthData.largeExpenses || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentMonthData.largeExpenses]);

      const currentTaxTotal = useMemo(() => {
        return (currentMonthData.taxInsurance || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentMonthData.taxInsurance]);

      const currentExpenseTotal = currentLivingTotal + currentLargeTotal + currentTaxTotal;
      const currentProfitAndLoss = currentIncomeTotal - currentExpenseTotal;

      // 最新ストック抽出（カード②用）
      const latestStockSummary = useMemo(() => {
        const keys = Object.keys(monthlyActuals).filter(k => {
          const d = monthlyActuals[k];
          if (!d || !d.stockBalances) return false;
          const list = Array.isArray(d.stockBalances) ? d.stockBalances : Object.values(d.stockBalances);
          return list.reduce((sum, item) => sum + (Number(item.amount || item) || 0), 0) > 0;
        }).sort();

        if (keys.length === 0) return null;
        const latestKey = keys[keys.length - 1];
        const latest = monthlyActuals[latestKey];
        const stockList = Array.isArray(latest.stockBalances) ? latest.stockBalances : [];
        
        const getAmt = (id) => {
          const item = stockList.find(x => x.id === id);
          return item ? Number(item.amount) || 0 : (latest.stockBalances?.[id] || 0);
        };

        const cash = getAmt('cash');
        const fund = getAmt('fund');
        const stock = getAmt('stock');
        const bond = getAmt('bond');
        const total = cash + fund + stock + bond;

        return {
          key: latestKey,
          totalMan: Math.round(total / 10000),
          cashMan: Math.round(cash / 10000),
          fundMan: Math.round(fund / 10000),
          stockMan: Math.round(stock / 10000),
          bondMan: Math.round(bond / 10000),
          raw: { cash, fund, stock, bond, total }
        };
      }, [monthlyActuals]);

      // --- シミュレーション計算エンジン（計画／実績再計算用） ---
      const calculateSimulation = (initialPortfolio, initStrategy, initMinCash) => {
        let currentCash = initialPortfolio.cash.amount;
        let currentFund = initialPortfolio.mutualFund.amount;
        let currentStock = initialPortfolio.stock.amount;
        let currentTotal = currentCash + currentFund + currentStock;
        const data = [];
        
        const startAge = profile.startAge;
        const endAge = profile.endAge;
        const startYear = profile.startYear;

        for (let age = startAge; age <= endAge; age++) {
          const year = startYear + (age - startAge);
          const startAsset = currentTotal;

          let investmentReturn = 0;

          if (initStrategy === 'weighted') {
            const grossReturn = currentTotal > 0 ? currentTotal * (averageYield / 100) : 0;
            investmentReturn = grossReturn * 0.8;
          } else {
            const fundReturn = currentFund > 0 ? currentFund * (initialPortfolio.mutualFund.rate / 100) * 0.8 : 0;
            const stockReturn = currentStock > 0 ? currentStock * (initialPortfolio.stock.rate / 100) * 0.8 : 0;
            investmentReturn = fundReturn + stockReturn;
          }

          const incomePhase = incomePhases.find(p => age >= p.start && age <= p.end);
          const income = incomePhase ? incomePhase.amount : 0;
          const pensionPhase = pensionPhases.find(p => age >= p.start && age <= p.end);
          const pension = pensionPhase ? pensionPhase.amount : 0;

          const yearEvents = events.filter(e => e.age === age);
          const specialIncome = yearEvents.filter(e => e.amount > 0).reduce((sum, e) => sum + e.amount, 0);
          const totalIncome = investmentReturn + pension + income + specialIncome;

          const livingPhase = livingPhases.find(p => age >= p.start && age <= p.end);
          const baseLiving = livingPhase ? livingPhase.amount : 0;
          const inflatedLiving = baseLiving * Math.pow(1 + params.inflationRate / 100, age - startAge);
          const taxPhase = taxPhases.find(p => age >= p.start && age <= p.end);
          const tax = taxPhase ? taxPhase.amount : 0;
          const specialExpense = Math.abs(yearEvents.filter(e => e.amount < 0).reduce((sum, e) => sum + e.amount, 0));
          const totalExpense = inflatedLiving + tax + specialExpense;

          const profitAndLoss = totalIncome - totalExpense;
          currentTotal = currentTotal + profitAndLoss;

          if (initStrategy === 'cashFirst') {
            currentCash += (investmentReturn + pension + income + specialIncome);
            currentCash -= totalExpense;

            if (currentCash < initMinCash) {
              const shortfall = initMinCash - currentCash;
              if (currentFund >= shortfall) {
                currentFund -= shortfall;
                currentCash = initMinCash;
              } else {
                const remainShortfall = shortfall - currentFund;
                currentFund = 0;
                if (currentStock >= remainShortfall) {
                  currentStock -= remainShortfall;
                  currentCash = initMinCash;
                } else {
                  currentCash = initMinCash - (remainShortfall - currentStock);
                  currentStock = 0;
                }
              }
            }
          } else {
            const ratio = currentTotal > 0 && totalAsset > 0 ? currentTotal / totalAsset : 0;
            currentCash = initialPortfolio.cash.amount * ratio;
            currentFund = initialPortfolio.mutualFund.amount * ratio;
            currentStock = initialPortfolio.stock.amount * ratio;
          }

          const eventTitles = yearEvents.map(e => e.title).join(' / ');

          const endAssetRounded = Math.round(currentTotal);
          const c = Math.max(0, Math.round(currentCash));
          const f = Math.max(0, Math.round(currentFund));
          const s = Math.max(0, Math.round(currentStock));
          const validSum = c + f + s;
          const cashRatio = validSum > 0 ? Number(((c / validSum) * 100).toFixed(1)) : 0;
          const fundRatio = validSum > 0 ? Number(((f / validSum) * 100).toFixed(1)) : 0;
          const stockRatio = validSum > 0 ? Number(((s / validSum) * 100).toFixed(1)) : 0;

          const prevAsset = Math.round(startAsset);
          const diffFromPrev = endAssetRounded - prevAsset;
          const diffRatioFromPrev = prevAsset !== 0 ? Number(((diffFromPrev / prevAsset) * 100).toFixed(1)) : 0;

          data.push({
            age,
            year,
            startAsset: prevAsset,
            income,
            specialIncome,
            investmentReturn: Math.round(investmentReturn),
            pension,
            totalIncome: Math.round(totalIncome),
            livingExpense: Math.round(inflatedLiving),
            specialExpense,
            tax,
            totalExpense: Math.round(totalExpense),
            profitAndLoss: Math.round(profitAndLoss),
            endAsset: endAssetRounded,
            prevAsset,
            diffFromPrev,
            diffRatioFromPrev,
            breakdown: { cash: c, fund: f, stock: s, cashRatio, fundRatio, stockRatio },
            eventTitles
          });
        }
        return data;
      };

      // ① 当初計画のシミュレーション
      const simulationData = useMemo(() => {
        return calculateSimulation(portfolio, withdrawalStrategy, minCashReserve);
      }, [profile, params, incomePhases, livingPhases, pensionPhases, taxPhases, events, totalAsset, averageYield, withdrawalStrategy, minCashReserve, portfolio]);

      const planFinalAsset = simulationData[simulationData.length - 1]?.endAsset || 0;

      // ④ 最新実績を起点とした将来再シミュレーション＆差額インパクト
      const actualRollingImpact = useMemo(() => {
        if (!latestStockSummary) return null;
        
        // 最新実績の内訳（万円換算、債券は預金・現金に合算して運用）
        const actualPortfolio = {
          cash: { amount: latestStockSummary.cashMan + latestStockSummary.bondMan, rate: portfolio.cash.rate },
          mutualFund: { amount: latestStockSummary.fundMan, rate: portfolio.mutualFund.rate },
          stock: { amount: latestStockSummary.stockMan, rate: portfolio.stock.rate }
        };

        const reSimData = calculateSimulation(actualPortfolio, withdrawalStrategy, minCashReserve);
        const actualFinalAsset = reSimData[reSimData.length - 1]?.endAsset || 0;
        const diffFromPlan = actualFinalAsset - planFinalAsset;

        return {
          actualFinalAsset,
          diffFromPlan
        };
      }, [latestStockSummary, portfolio, withdrawalStrategy, minCashReserve, planFinalAsset, profile, params, incomePhases, livingPhases, pensionPhases, taxPhases, events, totalAsset, averageYield]);

      // 資金枯渇チェック
      const depletionInfo = useMemo(() => {
        const firstDepleted = simulationData.find(d => d.endAsset < 0);
        if (firstDepleted) {
          return { isDepleted: true, year: firstDepleted.year, age: firstDepleted.age };
        }
        return { isDepleted: false, year: null, age: null };
      }, [simulationData]);

      const handlePortfolioChange = (category, field, value) => {
        setPortfolio({ ...portfolio, [category]: { ...portfolio[category], [field]: parseFloat(value) || 0 } });
      };

      const createPhaseHandlers = (state, setState) => ({
        add: () => setState([...state, { id: Date.now(), start: profile.startAge, end: profile.endAge, amount: 0 }]),
        remove: (id) => setState(state.filter(p => p.id !== id)),
        update: (id, field, value) => setState(state.map(p => p.id === id ? { ...p, [field]: parseFloat(value) || 0 } : p))
      });

      const incomeHandlers = createPhaseHandlers(incomePhases, setIncomePhases);
      const livingHandlers = createPhaseHandlers(livingPhases, setLivingPhases);
      const pensionHandlers = createPhaseHandlers(pensionPhases, setPensionPhases);
      const taxHandlers = createPhaseHandlers(taxPhases, setTaxPhases);

      const addEvent = () => {
        const nextEvents = [...events, { id: Date.now(), age: profile.startAge, title: '新規イベント', amount: 0 }];
        nextEvents.sort((a, b) => a.age - b.age);
        setEvents(nextEvents);
      };
      const removeEvent = (id) => setEvents(events.filter(e => e.id !== id));
      const updateEvent = (id, field, value) => {
        const nextEvents = events.map(e => e.id === id ? { ...e, [field]: field === 'title' ? value : parseFloat(value) || 0 } : e);
        if (field === 'age') nextEvents.sort((a, b) => a.age - b.age);
        setEvents(nextEvents);
      };

      // --- テーマ別スタイルマッピング ---
      const themeStyles = {
        light: {
          bg: 'bg-slate-100',
          text: 'text-slate-800',
          cardBg: 'bg-white',
          border: 'border-slate-200',
          headerBg: 'bg-slate-900',
          headerText: 'text-white',
          accentBtn: 'bg-teal-600 hover:bg-teal-500 text-white',
          actBtn: 'bg-blue-600 hover:bg-blue-500 text-white',
          subBtn: 'bg-slate-800 hover:bg-slate-700 text-teal-300 border border-teal-500/30',
          thBase: 'bg-slate-200 text-slate-800 border-b border-slate-300',
          thIncome: 'bg-teal-100 text-teal-950 border-b border-slate-300',
          thExpense: 'bg-rose-100 text-rose-950 border-b border-slate-300',
          thTotal: 'bg-slate-300 text-slate-900 border-b border-slate-400 font-black',
          tableRowHover: 'hover:bg-teal-50/50',
          tableBorder: 'border-slate-100',
          chartLine: '#0d9488',
          inputBg: 'bg-white text-slate-800 border-slate-300',
          panelHeader: 'bg-slate-900 text-white',
          modalCardBg: 'bg-white text-slate-800 border-slate-200',
          modalColBg: 'bg-slate-50 border-slate-200',
          modalItemBg: 'bg-white border-slate-200',
          modalTextMain: 'text-slate-800',
          modalTextSub: 'text-slate-500'
        },
        dark: {
          bg: 'bg-zinc-950',
          text: 'text-zinc-100',
          cardBg: 'bg-zinc-900',
          border: 'border-zinc-800',
          headerBg: 'bg-black border-b border-zinc-800',
          headerText: 'text-white',
          accentBtn: 'bg-cyan-600 hover:bg-cyan-500 text-white',
          actBtn: 'bg-indigo-600 hover:bg-indigo-500 text-white',
          subBtn: 'bg-zinc-800 hover:bg-zinc-700 text-cyan-400 border border-cyan-500/30',
          thBase: 'bg-zinc-800 text-zinc-100 border-b border-zinc-700',
          thIncome: 'bg-cyan-950 text-cyan-200 border-b border-zinc-700',
          thExpense: 'bg-rose-950 text-rose-200 border-b border-zinc-700',
          thTotal: 'bg-zinc-700 text-white border-b border-zinc-600 font-black',
          tableRowHover: 'hover:bg-zinc-800/60',
          tableBorder: 'border-zinc-800',
          chartLine: '#06b6d4',
          inputBg: 'bg-zinc-800 text-white border-zinc-700',
          panelHeader: 'bg-black text-white border-b border-zinc-800',
          modalCardBg: 'bg-zinc-900 text-zinc-100 border-zinc-800',
          modalColBg: 'bg-zinc-950 border-zinc-800',
          modalItemBg: 'bg-zinc-900 border-zinc-700',
          modalTextMain: 'text-zinc-100',
          modalTextSub: 'text-zinc-400'
        },
        pop: {
          bg: 'bg-[#fff5f5]',
          text: 'text-rose-950',
          cardBg: 'bg-white/95 backdrop-blur shadow-sm',
          border: 'border-pink-200',
          headerBg: 'bg-gradient-to-r from-pink-500 via-rose-500 to-pink-600',
          headerText: 'text-white font-bold',
          accentBtn: 'bg-gradient-to-r from-pink-500 to-rose-400 hover:opacity-90 text-white font-bold shadow-md shadow-pink-200',
          actBtn: 'bg-gradient-to-r from-sky-500 to-indigo-500 hover:opacity-90 text-white font-bold shadow-md shadow-sky-200',

                    className={`p-3 rounded-xl border text-center transition flex flex-col items-center space-y-2 ${theme === 'light' ? 'border-teal-500 bg-teal-50/20 ring-2 ring-teal-500/30' : 'border-slate-200 hover:bg-slate-500/5'}`}
                  >
                    <div className="w-8 h-8 rounded-full bg-slate-100 border border-slate-300 flex items-center justify-center text-slate-800 shadow-sm">
                      <i className="fa-solid fa-sun text-sm"></i>
                    </div>
                    <span className="text-xs font-bold">ライト</span>
                  </button>

                  <button 
                    onClick={() => setTheme('dark')}
                    className={`p-3 rounded-xl border text-center transition flex flex-col items-center space-y-2 ${theme === 'dark' ? 'border-cyan-500 bg-cyan-950/20 ring-2 ring-cyan-500/30' : 'border-slate-200 hover:bg-slate-500/5'}`}
                  >
                    <div className="w-8 h-8 rounded-full bg-zinc-900 border border-zinc-700 flex items-center justify-center text-cyan-400 shadow-sm">
                      <i className="fa-solid fa-moon text-sm"></i>
                    </div>
                    <span className="text-xs font-bold">ダーク</span>
                  </button>

                  <button 
                    onClick={() => setTheme('pop')}
                    className={`p-3 rounded-xl border text-center transition flex flex-col items-center space-y-2 ${theme === 'pop' ? 'border-pink-500 bg-pink-50 ring-2 ring-pink-400/40' : 'border-slate-200 hover:bg-slate-500/5'}`}
                  >
                    <div className="w-8 h-8 rounded-full bg-gradient-to-r from-pink-400 to-rose-400 text-white flex items-center justify-center shadow-sm">
                      <span>🌸</span>
                    </div>
                    <span className="text-xs font-bold text-rose-600">ポップ</span>
                  </button>
                </div>
              </div>

              {/* 今後拡張用エリア */}
              <div className="pt-4 border-t border-slate-200/40 space-y-3">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-60">データ連携・実績管理設定</h3>
                <div className="bg-slate-500/5 p-3.5 rounded-xl border border-slate-200/40 space-y-2">
                  <div className="flex items-center justify-between text-xs font-bold opacity-80">
                    <span>マネーフォワードCSV連携</span>
                    <span className="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">準備中</span>
                  </div>
                  <p className="text-[11px] opacity-60">
                    月次実績の自動集計やCSV取り込み設定を今後ここに追加します。
                  </p>
                </div>
              </div>

            </div>
          </div>

          {(activeDrawer || selectedYearData) && (
            <div 
              className="fixed inset-0 bg-slate-900/50 z-40 transition-opacity"
              onClick={() => { setActiveDrawer(null); setSelectedYearData(null); }}
            ></div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
