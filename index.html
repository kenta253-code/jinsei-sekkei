<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動的・人生設計シミュレーター</title>
  
  <!-- ライブラリの読み込み -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f8fafc; }
    /* スクロールバーのカスタマイズ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine } = window.Recharts;

    const App = () => {
      // --- 1. パラメータのステート管理（単位：万円） ---
      const [params, setParams] = useState({
        initialAsset: 7400,
        yieldRate: 3.0,
        inflationRate: 0.0,
        pensionStartAge: 60,
        pensionAmount: 150,
        baseTax: 46 // 住民税・社会保険料などの基本ベース
      });

      const [microCorp, setMicroCorp] = useState({
        startAge: 56,
        revenue: 0 // 年間収益（万円）
      });

      const [livingPhases, setLivingPhases] = useState([
        { id: 1, start: 56, end: 69, amount: 300 },
        { id: 2, start: 70, end: 80, amount: 250 }
      ]);

      const [events, setEvents] = useState([
        { id: 1, age: 56, title: 'マイクロ法人設立・旅', amount: -300 },
        { id: 2, age: 58, title: 'マンション売却', amount: 4300 },
        { id: 3, age: 58, title: '新居購入', amount: -6500 },
        { id: 4, age: 60, title: 'iDeCo・MOL株等', amount: 1000 },
        { id: 5, age: 60, title: 'ポルシェ911購入', amount: -800 }
      ]);

      // --- 2. シミュレーション計算ロジック ---
      const simulationData = useMemo(() => {
        let currentBase = params.initialAsset;
        let currentCorp = params.initialAsset;
        const data = [];
        
        for (let age = 56; age <= 80; age++) {
          // 生活費の算出（インフレ加味）
          const phase = livingPhases.find(p => age >= p.start && age <= p.end);
          const baseLiving = phase ? phase.amount : 0;
          const inflatedLiving = baseLiving * Math.pow(1 + params.inflationRate / 100, age - 56);
          
          // 特別イベントの合算
          const yearEvents = events.filter(e => e.age === age);
          const eventSum = yearEvents.reduce((sum, e) => sum + e.amount, 0);
          
          // 年金
          const pension = age >= params.pensionStartAge ? params.pensionAmount : 0;
          
          // 基本の収支（運用益・法人収益を除く）
          const baseCashFlow = pension + eventSum - inflatedLiving - params.baseTax;
          
          // 運用益（年初残高に対して計算）
          const baseReturn = currentBase > 0 ? currentBase * (params.yieldRate / 100) : 0;
          const corpReturn = currentCorp > 0 ? currentCorp * (params.yieldRate / 100) : 0;
          
          // マイクロ法人収益
          const corpRev = age >= microCorp.startAge ? microCorp.revenue : 0;

          // 残高更新
          currentBase = currentBase + baseReturn + baseCashFlow;
          currentCorp = currentCorp + corpReturn + baseCashFlow + corpRev;

          data.push({
            age,
            '計画ベース (現在)': Math.round(currentBase),
            '法人収益アリ (ポテンシャル)': Math.round(currentCorp),
            expense: Math.round(inflatedLiving)
          });
        }
        return data;
      }, [params, microCorp, livingPhases, events]);

      // --- 3. 枯渇年齢と最終残高の取得 ---
      const endDataBase = simulationData[simulationData.length - 1]['計画ベース (現在)'];
      const endDataCorp = simulationData[simulationData.length - 1]['法人収益アリ (ポテンシャル)'];
      const depletionBase = simulationData.find(d => d['計画ベース (現在)'] < 0)?.age || '枯渇なし';
      const depletionCorp = simulationData.find(d => d['法人収益アリ (ポテンシャル)'] < 0)?.age || '枯渇なし';

      // --- 4. UIハンドラー ---
      const handleParamChange = (e) => setParams({ ...params, [e.target.name]: parseFloat(e.target.value) || 0 });
      const handleCorpChange = (e) => setMicroCorp({ ...microCorp, [e.target.name]: parseFloat(e.target.value) || 0 });
      
      const updatePhase = (id, field, value) => {
        setLivingPhases(livingPhases.map(p => p.id === id ? { ...p, [field]: parseFloat(value) || 0 } : p));
      };
      
      const updateEvent = (id, field, value) => {
        setEvents(events.map(e => e.id === id ? { ...e, [field]: field === 'title' ? value : parseFloat(value) || 0 } : e));
      };

      const CustomTooltip = ({ active, payload, label }) => {
        if (active && payload && payload.length) {
          return (
            <div className="bg-white p-3 border border-gray-200 shadow-lg rounded">
              <p className="font-bold text-gray-700">{`${label}歳 (20${label - 56 + 27}年)`}</p>
              {payload.map((entry, index) => (
                <p key={index} style={{ color: entry.color }} className="text-sm font-bold">
                  {entry.name}: {entry.value.toLocaleString()} 万円
                </p>
              ))}
            </div>
          );
        }
        return null;
      };

      return (
        <div className="min-h-screen flex flex-col h-screen">
          {/* ヘッダー */}
          <header className="bg-slate-900 text-white p-4 flex justify-between items-center shrink-0">
            <div className="flex items-center space-x-3">
              <i className="fa-solid fa-compass-drafting text-2xl text-teal-400"></i>
              <h1 className="text-xl font-bold tracking-wider">Dynamic Life Plan Simulator</h1>
            </div>
            <div className="text-sm bg-slate-800 px-4 py-1.5 rounded-full border border-slate-700">
              <i className="fa-solid fa-user-tie mr-2 text-teal-400"></i>長原 健太 様
            </div>
          </header>

          <div className="flex flex-1 overflow-hidden">
            {/* 左パネル：操縦席 (スクロール可能) */}
            <aside className="w-1/3 bg-white border-r border-gray-200 p-6 overflow-y-auto">
              <h2 className="text-lg font-bold text-gray-800 mb-6 border-b pb-2"><i className="fa-solid fa-sliders mr-2"></i>シミュレーション・パラメータ</h2>
              
              {/* マイクロ法人収益（ワクワク要素） */}
              <div className="bg-teal-50 border border-teal-200 rounded-xl p-4 mb-6">
                <h3 className="text-sm font-bold text-teal-800 mb-3"><i className="fa-solid fa-rocket mr-2"></i>【攻撃力】マイクロ法人事業収益</h3>
                <div className="flex items-center justify-between bg-white rounded p-2 border border-teal-100">
                  <span className="text-sm text-gray-600 font-bold ml-2">年間収益目標</span>
                  <div className="flex items-center">
                    <input type="number" name="revenue" value={microCorp.revenue} onChange={handleCorpChange} className="w-20 text-right font-bold text-teal-600 bg-transparent focus:outline-none" />
                    <span className="text-sm text-gray-500 ml-1 mr-2">万円/年</span>
                  </div>
                </div>
                <p className="text-xs text-teal-600 mt-2 text-right">※この収益がシミュレーションの延命効果を生みます</p>
              </div>

              {/* 基本設定 */}
              <div className="mb-6 space-y-4">
                <h3 className="text-sm font-bold text-gray-700"><i className="fa-solid fa-chart-line mr-2"></i>マクロ環境・基本設定</h3>
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-gray-50 p-3 rounded border border-gray-200">
                    <label className="block text-xs text-gray-500 mb-1">投資利回り (%)</label>
                    <input type="number" step="0.1" name="yieldRate" value={params.yieldRate} onChange={handleParamChange} className="w-full bg-transparent font-bold text-gray-800 focus:outline-none" />
                  </div>
                  <div className="bg-gray-50 p-3 rounded border border-gray-200">
                    <label className="block text-xs text-gray-500 mb-1">インフレ率 (%)</label>
                    <input type="number" step="0.1" name="inflationRate" value={params.inflationRate} onChange={handleParamChange} className="w-full bg-transparent font-bold text-gray-800 focus:outline-none" />
                  </div>
                </div>
              </div>

              {/* 年代別生活費 */}
              <div className="mb-6">
                <h3 className="text-sm font-bold text-gray-700 mb-3"><i className="fa-solid fa-house-chimney mr-2"></i>年代別 年間生活費</h3>
                <div className="space-y-2">
                  {livingPhases.map(phase => (
                    <div key={phase.id} className="flex items-center space-x-2 bg-gray-50 p-2 rounded border border-gray-200">
                      <input type="number" value={phase.start} onChange={(e) => updatePhase(phase.id, 'start', e.target.value)} className="w-12 text-center text-sm font-bold bg-white border rounded" />
                      <span className="text-xs text-gray-500">歳〜</span>
                      <input type="number" value={phase.end} onChange={(e) => updatePhase(phase.id, 'end', e.target.value)} className="w-12 text-center text-sm font-bold bg-white border rounded" />
                      <span className="text-xs text-gray-500">歳:</span>
                      <input type="number" value={phase.amount} onChange={(e) => updatePhase(phase.id, 'amount', e.target.value)} className="w-16 text-right text-sm font-bold bg-white border rounded ml-auto" />
                      <span className="text-xs text-gray-500">万円</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* ライフイベント */}
              <div>
                <h3 className="text-sm font-bold text-gray-700 mb-3"><i className="fa-solid fa-calendar-check mr-2"></i>特別イベント (支出はマイナス)</h3>
                <div className="space-y-2">
                  {events.map(event => (
                    <div key={event.id} className="flex items-center space-x-2 bg-gray-50 p-2 rounded border border-gray-200">
                      <input type="number" value={event.age} onChange={(e) => updateEvent(event.id, 'age', e.target.value)} className="w-12 text-center text-sm font-bold bg-white border rounded" />
                      <span className="text-xs text-gray-500">歳</span>
                      <input type="text" value={event.title} onChange={(e) => updateEvent(event.id, 'title', e.target.value)} className="flex-1 text-sm bg-white border rounded px-1" />
                      <input type="number" value={event.amount} onChange={(e) => updateEvent(event.id, 'amount', e.target.value)} className={`w-16 text-right text-sm font-bold bg-white border rounded ${event.amount < 0 ? 'text-red-500' : 'text-blue-500'}`} />
                    </div>
                  ))}
                </div>
              </div>
            </aside>

            {/* 右パネル：ダッシュボード */}
            <main className="w-2/3 bg-slate-50 p-6 overflow-y-auto flex flex-col">
              
              {/* サマリーカード */}
              <div className="grid grid-cols-2 gap-4 mb-6 shrink-0">
                <div className="bg-white rounded-xl shadow-sm p-5 border-l-4 border-slate-400">
                  <p className="text-xs text-gray-500 font-bold mb-1">【現在計画】 80歳時点の予想残金</p>
                  <div className="flex items-end space-x-2">
                    <span className={`text-3xl font-black tracking-tight ${endDataBase < 0 ? 'text-red-500' : 'text-slate-800'}`}>
                      {endDataBase.toLocaleString()}
                    </span>
                    <span className="text-sm text-gray-500 font-bold mb-1">万円</span>
                  </div>
                  <p className="text-xs text-gray-400 mt-2">
                    資金枯渇予想: <span className="font-bold text-gray-600">{typeof depletionBase === 'number' ? `${depletionBase}歳` : depletionBase}</span>
                  </p>
                </div>

                <div className="bg-white rounded-xl shadow-sm p-5 border-l-4 border-teal-400 relative overflow-hidden">
                  <div className="absolute -right-4 -top-4 opacity-10">
                    <i className="fa-solid fa-rocket text-8xl text-teal-500"></i>
                  </div>
                  <p className="text-xs text-teal-600 font-bold mb-1">【法人収益アリ】 80歳時点の予想残金</p>
                  <div className="flex items-end space-x-2 relative z-10">
                    <span className={`text-3xl font-black tracking-tight ${endDataCorp < 0 ? 'text-red-500' : 'text-teal-600'}`}>
                      {endDataCorp.toLocaleString()}
                    </span>
                    <span className="text-sm text-gray-500 font-bold mb-1">万円</span>
                  </div>
                  <p className="text-xs text-gray-400 mt-2 relative z-10">
                    資金枯渇予想: <span className="font-bold text-teal-700">{typeof depletionCorp === 'number' ? `${depletionCorp}歳` : depletionCorp}</span>
                    {typeof depletionCorp === 'number' && typeof depletionBase === 'number' && depletionCorp > depletionBase && (
                      <span className="ml-2 bg-teal-100 text-teal-800 px-2 py-0.5 rounded text-[10px] font-bold">+{depletionCorp - depletionBase}年の延命!</span>
                    )}
                  </p>
                </div>
              </div>

              {/* グラフエリア */}
              <div className="bg-white rounded-xl shadow-sm p-4 flex-1 border border-gray-200 min-h-[400px]">
                <h3 className="text-sm font-bold text-gray-700 mb-4"><i className="fa-solid fa-chart-area mr-2"></i>資産推移シミュレーション (56歳〜80歳)</h3>
                <ResponsiveContainer width="100%" height="90%">
                  <LineChart data={simulationData} margin={{ top: 20, right: 30, left: 20, bottom: 5 }}>
                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                    <XAxis dataKey="age" tickFormatter={(tick) => `${tick}歳`} tick={{ fontSize: 12, fill: '#64748b' }} axisLine={false} tickLine={false} />
                    <YAxis tickFormatter={(tick) => `${tick / 10000}億`} tick={{ fontSize: 12, fill: '#64748b' }} axisLine={false} tickLine={false} />
                    <Tooltip content={<CustomTooltip />} />
                    <Legend wrapperStyle={{ fontSize: '12px', fontWeight: 'bold' }} />
                    <ReferenceLine y={0} stroke="#ef4444" strokeDasharray="3 3" />
                    <Line type="monotone" dataKey="計画ベース (現在)" stroke="#94a3b8" strokeWidth={3} dot={{ r: 3 }} activeDot={{ r: 6 }} />
                    <Line type="monotone" dataKey="法人収益アリ (ポテンシャル)" stroke="#14b8a6" strokeWidth={3} dot={{ r: 3 }} activeDot={{ r: 6 }} />
                  </LineChart>
                </ResponsiveContainer>
              </div>

            </main>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
