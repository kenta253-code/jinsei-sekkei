<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生設計＆資金計画シミュレーター</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f8fafc; }
    .table-container { max-height: calc(100vh - 350px); overflow-y: auto; }
    thead th { position: sticky; top: 0; z-index: 10; background-color: #f1f5f9; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine } = window.Recharts;

    const App = () => {
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      const [portfolio, setPortfolio] = useState({
        cash: { amount: 2000, rate: 0.0 },
        mutualFund: { amount: 3000, rate: 4.0 },
        stock: { amount: 2400, rate: 6.0 }
      });

      const { totalAsset, averageYield } = useMemo(() => {
        const total = portfolio.cash.amount + portfolio.mutualFund.amount + portfolio.stock.amount;
        if (total === 0) return { totalAsset: 0, averageYield: 0 };
        const weightedReturn = (portfolio.cash.amount * portfolio.cash.rate) + (portfolio.mutualFund.amount * portfolio.mutualFund.rate) + (portfolio.stock.amount * portfolio.stock.rate);
        return { totalAsset: total, averageYield: Number((weightedReturn / total).toFixed(2)) };
      }, [portfolio]);

      const [params, setParams] = useState({
        inflationRate: 0.0,
        pensionStartAge: 60,
        pensionAmount: 150,
        baseTax: 46
      });

      const [microCorp, setMicroCorp] = useState({
        startAge: 56,
        revenue: 0
      });

      // 自由に追加・編集・削除できるようにステート化
      const [livingPhases, setLivingPhases] = useState([
        { id: 1, start: 56, end: 69, amount: 300 },
        { id: 2, start: 70, end: 80, amount: 250 }
      ]);

      const [events, setEvents] = useState([
        { id: 1, age: 56, title: '旅・法人設立', amount: -300 },
        { id: 2, age: 58, title: 'マンション売却', amount: 4300 },
        { id: 3, age: 58, title: '新居購入', amount: -6500 },
        { id: 4, age: 60, title: 'iDeCo等', amount: 1000 },
        { id: 5, age: 60, title: 'ポルシェ購入', amount: -800 }
      ]);

      // --- シミュレーション計算 ---
      const simulationData = useMemo(() => {
        let currentAsset = totalAsset;
        const data = [];
        
        for (let age = 56; age <= 80; age++) {
          const year = 2027 + (age - 56);
          const startAsset = currentAsset;

          const investmentReturn = currentAsset > 0 ? currentAsset * (averageYield / 100) : 0;
          const pension = age >= params.pensionStartAge ? params.pensionAmount : 0;
          const corpRev = age >= microCorp.startAge ? microCorp.revenue : 0;
          const yearEvents = events.filter(e => e.age === age);
          const specialIncome = yearEvents.filter(e => e.amount > 0).reduce((sum, e) => sum + e.amount, 0);
          
          const totalIncome = investmentReturn + pension + corpRev + specialIncome;

          const phase = livingPhases.find(p => age >= p.start && age <= p.end);
          const baseLiving = phase ? phase.amount : 0;
          const inflatedLiving = baseLiving * Math.pow(1 + params.inflationRate / 100, age - 56);
          const specialExpense = Math.abs(yearEvents.filter(e => e.amount < 0).reduce((sum, e) => sum + e.amount, 0));
          
          const totalExpense = inflatedLiving + params.baseTax + specialExpense;
          const profitAndLoss = totalIncome - totalExpense;
          currentAsset = currentAsset + profitAndLoss;

          const eventTitles = yearEvents.map(e => e.title).join(' / ');

          data.push({
            age,
            year,
            startAsset: Math.round(startAsset),
            investmentReturn: Math.round(investmentReturn),
            pension,
            corpRev,
            specialIncome,
            totalIncome: Math.round(totalIncome),
            livingExpense: Math.round(inflatedLiving),
            tax: params.baseTax,
            specialExpense,
            totalExpense: Math.round(totalExpense),
            profitAndLoss: Math.round(profitAndLoss),
            endAsset: Math.round(currentAsset),
            eventTitles
          });
        }
        return data;
      }, [params, microCorp, livingPhases, events, totalAsset, averageYield]);

      // --- ハンドラー ---
      const handlePortfolioChange = (category, field, value) => setPortfolio({ ...portfolio, [category]: { ...portfolio[category], [field]: parseFloat(value) || 0 } });
      const handleParamChange = (e) => setParams({ ...params, [e.target.name]: parseFloat(e.target.value) || 0 });
      const handleCorpChange = (e) => setMicroCorp({ ...microCorp, [e.target.name]: parseFloat(e.target.value) || 0 });

      // 生活費フェーズの操作
      const updatePhase = (id, field, value) => setLivingPhases(livingPhases.map(p => p.id === id ? { ...p, [field]: parseFloat(value) || 0 } : p));
      const addPhase = () => setLivingPhases([...livingPhases, { id: Date.now(), start: 75, end: 80, amount: 200 }]);
      const removePhase = (id) => setLivingPhases(livingPhases.filter(p => p.id !== id));

      // イベントの操作
      const updateEvent = (id, field, value) => setEvents(events.map(e => e.id === id ? { ...e, [field]: field === 'title' ? value : parseFloat(value) || 0 } : e));
      const addEvent = () => setEvents([...events, { id: Date.now(), age: 65, title: '新規イベント', amount: -100 }]);
      const removeEvent = (id) => setEvents(events.filter(e => e.id !== id));

      return (
        <div className="min-h-screen flex flex-col bg-gray-50 overflow-hidden relative">
          <header className="bg-slate-800 text-white p-4 flex justify-between items-center shrink-0 shadow-md z-20">
            <div className="flex items-center space-x-3">
              <i className="fa-solid fa-chart-line text-2xl text-blue-400"></i>
              <h1 className="text-xl font-bold">人生計画シミュレーター</h1>
            </div>
            <button 
              onClick={() => setIsSettingsOpen(true)}
              className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold shadow transition-colors flex items-center space-x-2"
            >
              <i className="fa-solid fa-gear"></i>
              <span>パラメータ設定</span>
            </button>
          </header>

          <main className="flex-1 p-4 md:p-6 flex flex-col overflow-hidden">
            <div className="bg-white rounded-xl shadow-sm p-4 mb-4 shrink-0 border border-gray-200">
              <div className="flex justify-between items-center mb-2">
                <h3 className="text-sm font-bold text-gray-700">資産残高推移 (56歳〜80歳)</h3>
                <div className="text-xs font-bold">
                  80歳時点予測: <span className={`text-lg ml-2 ${simulationData[24].endAsset < 0 ? 'text-red-500' : 'text-blue-600'}`}>{simulationData[24].endAsset.toLocaleString()} 万円</span>
                </div>
              </div>
              <div className="h-40 w-full">
                <ResponsiveContainer width="100%" height="100%">
                  <LineChart data={simulationData} margin={{ top: 5, right: 20, left: 0, bottom: 0 }}>
                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                    <XAxis dataKey="age" tickFormatter={(tick) => `${tick}歳`} tick={{ fontSize: 10, fill: '#64748b' }} axisLine={false} tickLine={false} />
                    <YAxis tickFormatter={(tick) => `${tick / 10000}億`} tick={{ fontSize: 10, fill: '#64748b' }} axisLine={false} tickLine={false} width={40} />
                    <Tooltip formatter={(value) => [`${value.toLocaleString()} 万円`, '年末残高']} labelFormatter={(label) => `${label}歳`} />
                    <ReferenceLine y={0} stroke="#ef4444" strokeDasharray="3 3" />
                    <Line type="monotone" dataKey="endAsset" name="年末残高" stroke="#3b82f6" strokeWidth={3} dot={false} activeDot={{ r: 6 }} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </div>

            <div className="bg-white rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col overflow-hidden">
              <div className="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                <h3 className="text-sm font-bold text-gray-700">年次資金計画表</h3>
              </div>
              <div className="table-container flex-1">
                <table className="w-full text-sm text-right">
                  <thead>
                    <tr className="text-xs text-gray-500 border-b-2 border-gray-200">
                      <th className="p-2 text-center w-12">年齢</th>
                      <th className="p-2 text-center w-16">西暦</th>
                      <th className="p-2 text-gray-800">年初資産</th>
                      <th className="p-2 text-blue-600 bg-blue-50">投資益</th>
                      <th className="p-2 text-blue-600 bg-blue-50">年金</th>
                      <th className="p-2 text-blue-600 bg-blue-50">法人収益</th>
                      <th className="p-2 text-blue-600 bg-blue-50">特別収入</th>
                      <th className="p-2 text-red-500 bg-red-50">生活費</th>
                      <th className="p-2 text-red-500 bg-red-50">税・保険</th>
                      <th className="p-2 text-red-500 bg-red-50">特別支出</th>
                      <th className="p-2 text-gray-800 font-bold bg-gray-100">年間損益</th>
                      <th className="p-2 text-gray-800 font-bold bg-gray-100">年末資産</th>
                      <th className="p-2 text-left text-gray-500 w-48">イベント</th>
                    </tr>
                  </thead>
                  <tbody>
                    {simulationData.map((row) => (
                      <tr key={row.age} className={`border-b border-gray-100 hover:bg-yellow-50 ${row.endAsset < 0 ? 'bg-red-50' : ''}`}>
                        <td className="p-2 text-center font-bold text-gray-600">{row.age}</td>
                        <td className="p-2 text-center text-gray-500">{row.year}</td>
                        <td className="p-2">{row.startAsset.toLocaleString()}</td>
                        <td className="p-2 text-blue-600 bg-blue-50/30">{row.investmentReturn.toLocaleString()}</td>
                        <td className="p-2 text-blue-600 bg-blue-50/30">{row.pension.toLocaleString()}</td>
                        <td className="p-2 text-blue-600 bg-blue-50/30">{row.corpRev.toLocaleString()}</td>
                        <td className="p-2 text-blue-600 bg-blue-50/30">{row.specialIncome > 0 ? row.specialIncome.toLocaleString() : '-'}</td>
                        <td className="p-2 text-red-500 bg-red-50/30">{row.livingExpense.toLocaleString()}</td>
                        <td className="p-2 text-red-500 bg-red-50/30">{row.tax.toLocaleString()}</td>
                        <td className="p-2 text-red-500 bg-red-50/30">{row.specialExpense > 0 ? row.specialExpense.toLocaleString() : '-'}</td>
                        <td className={`p-2 font-bold bg-gray-50/50 ${row.profitAndLoss < 0 ? 'text-red-500' : 'text-blue-600'}`}>
                          {row.profitAndLoss > 0 ? '+' : ''}{row.profitAndLoss.toLocaleString()}
                        </td>
                        <td className={`p-2 font-bold bg-gray-50/50 ${row.endAsset < 0 ? 'text-red-600' : 'text-gray-800'}`}>
                          {row.endAsset.toLocaleString()}
                        </td>
                        <td className="p-2 text-left text-xs text-gray-500 truncate">{row.eventTitles}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* 設定ドロワー */}
          <div className={`fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl transform transition-transform duration-300 ease-in-out z-50 flex flex-col ${isSettingsOpen ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className="bg-slate-800 text-white p-4 flex justify-between items-center shrink-0">
              <h2 className="font-bold"><i className="fa-solid fa-sliders mr-2"></i>パラメータ調整</h2>
              <button onClick={() => setIsSettingsOpen(false)} className="text-gray-300 hover:text-white text-xl">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>
            
            <div className="p-5 overflow-y-auto flex-1 space-y-6">
              
              {/* ポートフォリオ */}
              <div className="border border-gray-200 rounded-lg p-3 bg-gray-50">
                <h3 className="text-xs font-bold text-gray-600 mb-2 border-b pb-1">退職時 資産内訳</h3>
                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-xs text-gray-500 w-16">現金</span>
                    <input type="number" value={portfolio.cash.amount} onChange={(e) => handlePortfolioChange('cash', 'amount', e.target.value)} className="w-16 text-right text-xs border rounded p-1" />万
                    <input type="number" step="0.1" value={portfolio.cash.rate} onChange={(e) => handlePortfolioChange('cash', 'rate', e.target.value)} className="w-12 text-right text-xs border rounded p-1" />%
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-xs text-gray-500 w-16">投資信託</span>
                    <input type="number" value={portfolio.mutualFund.amount} onChange={(e) => handlePortfolioChange('mutualFund', 'amount', e.target.value)} className="w-16 text-right text-xs border rounded p-1" />万
                    <input type="number" step="0.1" value={portfolio.mutualFund.rate} onChange={(e) => handlePortfolioChange('mutualFund', 'rate', e.target.value)} className="w-12 text-right text-xs border rounded p-1" />%
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-xs text-gray-500 w-16">株式</span>
                    <input type="number" value={portfolio.stock.amount} onChange={(e) => handlePortfolioChange('stock', 'amount', e.target.value)} className="w-16 text-right text-xs border rounded p-1" />万
                    <input type="number" step="0.1" value={portfolio.stock.rate} onChange={(e) => handlePortfolioChange('stock', 'rate', e.target.value)} className="w-12 text-right text-xs border rounded p-1" />%
                  </div>
                </div>
                <div className="mt-3 text-xs flex justify-between font-bold bg-blue-100 text-blue-800 p-2 rounded">
                  <span>総額: {totalAsset}万</span>
                  <span>平均利回り: {averageYield}%</span>
                </div>
              </div>

              {/* 法人収益・マクロ */}
              <div className="space-y-3">
                <div className="flex justify-between items-center border-b pb-2">
                  <span className="text-sm font-bold text-gray-700">法人収益 (万/年)</span>
                  <input type="number" name="revenue" value={microCorp.revenue} onChange={handleCorpChange} className="w-20 text-right border rounded p-1 font-bold text-blue-600" />
                </div>
                <div className="flex justify-between items-center border-b pb-2">
                  <span className="text-sm font-bold text-gray-700">インフレ率 (%)</span>
                  <input type="number" step="0.1" name="inflationRate" value={params.inflationRate} onChange={handleParamChange} className="w-20 text-right border rounded p-1" />
                </div>
              </div>

              {/* 年代別生活費（追加・削除可能に） */}
              <div>
                <div className="flex justify-between items-center mb-2">
                  <h3 className="text-sm font-bold text-gray-700">年代別 生活費設定</h3>
                  <button onClick={addPhase} className="text-xs bg-blue-600 text-white px-2 py-1 rounded font-bold hover:bg-blue-500">
                    <i className="fa-solid fa-plus mr-1"></i>追加
                  </button>
                </div>
                <div className="space-y-2">
                  {livingPhases.map(phase => (
                    <div key={phase.id} className="flex items-center space-x-1 bg-gray-50 p-2 rounded border">
                      <input type="number" value={phase.start} onChange={(e) => updatePhase(phase.id, 'start', e.target.value)} className="w-10 border rounded p-1 text-center text-xs" />〜
                      <input type="number" value={phase.end} onChange={(e) => updatePhase(phase.id, 'end', e.target.value)} className="w-10 border rounded p-1 text-center text-xs" />歳
                      <input type="number" value={phase.amount} onChange={(e) => updatePhase(phase.id, 'amount', e.target.value)} className="w-16 border rounded p-1 text-right text-red-500 font-bold text-xs" />万
                      <button onClick={() => removePhase(phase.id)} className="text-red-400 hover:text-red-600 px-1 text-xs">
                        <i className="fa-solid fa-trash"></i>
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* 特別イベント（追加・削除可能に） */}
              <div>
                <div className="flex justify-between items-center mb-2">
                  <h3 className="text-sm font-bold text-gray-700">特別イベント ※支出はマイナス</h3>
                  <button onClick={addEvent} className="text-xs bg-blue-600 text-white px-2 py-1 rounded font-bold hover:bg-blue-500">
                    <i className="fa-solid fa-plus mr-1"></i>追加
                  </button>
                </div>
                <div className="space-y-2">
                  {events.map(event => (
                    <div key={event.id} className="flex items-center space-x-1 bg-gray-50 p-2 rounded border">
                      <input type="number" value={event.age} onChange={(e) => updateEvent(event.id, 'age', e.target.value)} className="w-10 border rounded p-1 text-center text-xs" />歳
                      <input type="text" value={event.title} onChange={(e) => updateEvent(event.id, 'title', e.target.value)} className="flex-1 border rounded p-1 text-xs" />
                      <input type="number" value={event.amount} onChange={(e) => updateEvent(event.id, 'amount', e.target.value)} className="w-14 border rounded p-1 text-right font-bold text-xs" />万
                      <button onClick={() => removeEvent(event.id)} className="text-red-400 hover:text-red-600 px-1 text-xs">
                        <i className="fa-solid fa-trash"></i>
                      </button>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          </div>
          
          {isSettingsOpen && (
            <div 
              className="fixed inset-0 bg-black bg-opacity-40 z-40 transition-opacity"
              onClick={() => setIsSettingsOpen(false)}
            ></div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
